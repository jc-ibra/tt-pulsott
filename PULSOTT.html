<style>
:root{
  --fs-xs:.75rem; --fs-sm:.75rem; --fs-base:.875rem; --fs-md:1rem; --fs-lg:1.25rem; --fs-xl:1.75rem; --fs-2xl:2.25rem; /* escala única de letra */
  --bg:#ECEFF1; --surface:#FFFFFF; --sunk:#F5F7F8; --ink:#1B1F24; --muted:#5E6873; --line:#D3D9DE; --accent:#2B3A4A; --accent-ink:#FFFFFF;
  --verde:#1F8A4C; --amarillo:#E9B10A; --rojo:#D2342A; --negro:#000000; --gris:#A6AEB7; --cancel:#D3D9DE;
  --negro-ring:transparent; --focus:#E9B10A;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111518; --surface:#1A2025; --sunk:#151A1E; --ink:#E7ECEF; --muted:#9AA6B0; --line:#2D363D; --accent:#C9D6E2; --accent-ink:#111518;
    --verde:#3DBA6E; --amarillo:#F2C230; --rojo:#F0574C; --negro:#000000; --gris:#6E7882; --cancel:#3A444C; --negro-ring:#8A949D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111518; --surface:#1A2025; --sunk:#151A1E; --ink:#E7ECEF; --muted:#9AA6B0; --line:#2D363D; --accent:#C9D6E2; --accent-ink:#111518;
  --verde:#3DBA6E; --amarillo:#F2C230; --rojo:#F0574C; --negro:#000000; --gris:#6E7882; --cancel:#3A444C; --negro-ring:#8A949D; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:var(--fs-base);line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-stretch:80%;font-weight:750;letter-spacing:.005em}
h1{font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.05}
h2{font-size:var(--fs-lg)}
h3{font-size:var(--fs-md)}
p{margin:0}
.wrap{max-width:1320px;margin:0 auto;padding:18px 16px 56px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:4px 9px;font-size:var(--fs-base)}
.btn.danger{color:var(--rojo)}
.btn[disabled]{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-base);color:var(--muted)}
label.f > span b{color:var(--rojo)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.muted{color:var(--muted)}
.hidden{display:none !important}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;vertical-align:-1px;box-shadow:0 0 0 1px var(--negro-ring)}
.dot.verde{background:var(--verde)} .dot.amarillo{background:var(--amarillo)} .dot.rojo{background:var(--rojo)} .dot.negro{background:var(--negro)} .dot.gris{background:var(--gris)} .dot.cancel{background:var(--cancel)}
#msg{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:6px;font-weight:600;z-index:50;max-width:90vw}


/* Estructura con menú lateral */
.shell{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{background:#17222E;color:#DCE4EB;position:sticky;top:0;height:100vh;height:100dvh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.side .lamp{margin:0}
.side .lamp i{width:14px;height:14px;box-shadow:0 0 0 1px #8A949D}
.sbrand{display:flex;flex-direction:column;gap:8px;padding:4px 8px 14px;border-bottom:1px solid #2A3846}
.sbrand span{font-stretch:80%;font-weight:800;font-size:var(--fs-lg);line-height:1.1;color:#fff}
.sbtn{font:inherit;font-weight:700;border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;border:1px solid #3B5068;background:#1F3A5A;color:#fff;margin:8px 0 4px}
.sbtn:hover{background:#26476E}
.slabel{font-size:var(--fs-sm);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8DA0B3;padding:12px 8px 4px}
.sitem{display:flex;align-items:center;gap:10px;width:100%;font:inherit;font-weight:650;color:#DCE4EB;background:none;border:0;border-radius:8px;padding:10px 10px;cursor:pointer;text-align:left}
.sitem:hover,.sp:hover{background:#22303E}
.sitem.on,.sp.on{background:#2B3D50;color:#fff}
.splist{display:grid;gap:2px}
.sp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;font:inherit;font-size:var(--fs-base);color:#DCE4EB;background:none;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;text-align:left}
.sp .dot{width:10px;height:10px;box-shadow:0 0 0 1px #8A949D}
.sp .spn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp b{font-size:var(--fs-sm);color:#AFC0CF}
.sempty{font-size:var(--fs-base);color:#8DA0B3;padding:4px 10px}
.sarc summary{cursor:pointer;font-size:var(--fs-sm);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8DA0B3;padding:12px 8px 4px}
.sfoot{margin-top:auto;font-size:var(--fs-sm);color:#8DA0B3;padding:12px 8px 0;border-top:1px solid #2A3846}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;max-height:none}.splist{max-height:200px;overflow:auto}}
.shell > main.wrap{max-width:none;margin:0;min-width:0;width:100%;padding:18px 22px 56px}
.ptable .actions{flex-wrap:nowrap}
/* Resumen */
.toprow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;margin-bottom:6px}
.toprow .back{padding:0}
.back{background:none;border:0;padding:0 0 6px;font:inherit;font-size:var(--fs-base);font-weight:650;color:#1F5FBF;cursor:pointer}
.back:hover{text-decoration:underline}
.v-res .only-ops,.v-ops .only-res{display:none!important}
.gmenu{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin:6px 0 14px}
.gcell{border-right:1px solid var(--line);min-width:0}
.gcell:last-child{border-right:0}
.gcorte,.gop{display:grid;grid-template-rows:auto 1fr}
.gh{display:block;background:var(--sunk);border-bottom:1px solid var(--line);padding:7px 14px;font-size:var(--fs-sm);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.gb{display:flex;align-items:center;gap:6px;padding:8px 10px}
.gcorte input{width:auto;padding:5px 8px}
.gsolo{font:inherit;font-weight:700;font-size:var(--fs-md);background:var(--surface);color:var(--ink);border:0;border-right:1px solid var(--line);padding:0 22px;cursor:pointer}
.gsolo:last-child{border-right:0}
.gsolo:hover{background:var(--sunk)}
.gsolo.on{background:#1F5FBF;color:#fff}
.gpills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.gpills .opt{flex:0 1 auto}
.opt.linked{background:#C9EED6;color:#166534;box-shadow:inset 0 0 0 1.5px #6CC08B}
.opt.warn{background:#FFF1CC;color:#7A5B00}
.opt{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:var(--fs-base);border:0;border-radius:999px;padding:8px 12px;cursor:pointer;background:#DCE4EE;color:#1F4E8C;white-space:nowrap;font-size:var(--fs-base)}
.opt:hover{background:#CBD7E6}
.opt.on{background:#2F78C4;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .opt{background:#22303E;color:#AFC8E6}:root:not([data-theme="light"]) .opt.on{background:#2F78C4;color:#fff}}
@media (max-width:1760px){.gmenu{grid-template-columns:auto 1fr 1fr}.gop{grid-column:1/-1;order:5;border-top:1px solid var(--line);border-right:0}.gsolo{padding:14px}}
@media (max-width:700px){.gpills{flex-direction:column;align-items:stretch}}
/* Menú del proyecto: pestañas arriba, botones del operador abajo */
.pmenu{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);margin:6px 0 14px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.ptabs{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--sunk);border-bottom:1px solid var(--line);padding:8px 14px 0}
.ptablist{display:flex;gap:2px}
.ptab{font:inherit;font-size:var(--fs-md);font-weight:500;color:var(--muted);background:transparent;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;padding:9px 26px 10px;cursor:pointer;margin-bottom:-1px;position:relative}
.ptab:hover{color:var(--ink);background:color-mix(in srgb,var(--surface) 55%,transparent)}
.ptab.on{background:var(--surface);color:var(--ink);font-weight:600;border-color:var(--line);box-shadow:inset 0 3px 0 #D9A21B}
.pcorte{display:flex;align-items:center;gap:8px;padding-bottom:7px;font-size:var(--fs-sm);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pcorte input{width:auto;padding:4px 8px;font-size:var(--fs-base);letter-spacing:0;text-transform:none}
/* actualización automática de GLPI (segundo plano): línea azul corta con el % */
.glauto{display:inline-flex;align-items:center;gap:6px;padding-bottom:7px;margin-left:10px;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap}
.glauto:empty{display:none}
.glabar{width:56px;height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.glabar i{display:block;height:100%;background:#2563EB;border-radius:99px;transition:width .4s}
.glauto b{color:#2563EB;font-weight:700}
.pops{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px}
.plab{font-size:var(--fs-sm);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-right:8px}
.psep{width:1px;align-self:stretch;min-height:26px;background:var(--line)}
.pbtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:var(--fs-base);font-weight:500;color:var(--ink);background:var(--surface);border:1px solid color-mix(in srgb,var(--ink) 35%,transparent);border-radius:7px;padding:7px 16px;cursor:pointer;white-space:nowrap}
.pbtn:hover{background:var(--sunk)}
.pluz{width:20px;height:20px;flex:none;margin-left:2px;color:#6BF51F}
.pluz.err{color:#FF3B2F}
.fsel{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--muted);margin-left:auto}
.fsel .seg2 button{padding:3px 10px}.fsel .seg2 button[disabled]{opacity:.45;cursor:default}
.signal.glv{box-shadow:inset 4px 0 0 #2F78C4}.signal.glv .bigpct b{color:#1F5FBF}
.fuente.glv{color:#1F4E8C}.fuente.glv b{color:#1F5FBF}
.light[disabled]{cursor:default}
.fuente{flex-basis:100%;margin:2px 0 0;font-size:var(--fs-sm);color:var(--muted)}.fuente b{color:var(--ink);font-weight:600}
.glpill{flex-direction:column;align-items:flex-start;gap:0;line-height:1.15;padding:6px 14px}
.glpill small{font-size:var(--fs-xs);font-weight:500;opacity:.85}
.pbtn.on{background:color-mix(in srgb,#2F78C4 12%,var(--surface));border-color:#2F78C4;color:#1F5FBF;font-weight:600}
.pbtn:focus-visible,.ptab:focus-visible{outline:2px solid #2F78C4;outline-offset:2px}
.pops .opt{border-radius:7px;padding:6px 12px;font-size:var(--fs-base);font-weight:500}
@media (max-width:700px){.ptab{padding:9px 16px 10px}.pops{gap:8px}.psep{display:none}.plab{width:100%}.pbtn,.pops .opt{flex:1 1 auto;justify-content:center}}
/* Menú del proyecto compacto */
.pmenu{border-radius:9px;margin:4px 0 10px}
.ptabs{padding:4px 10px 0;gap:8px}
.ptab{font-size:var(--fs-base);padding:5px 16px 6px;border-radius:6px 6px 0 0}
.ptab.on{box-shadow:inset 0 2px 0 #D9A21B}
.pcorte{padding-bottom:4px;font-size:var(--fs-xs);gap:6px}.pcorte input{padding:2px 6px;font-size:var(--fs-sm)}
.pops{gap:6px;padding:5px 10px}
.plab{font-size:var(--fs-xs);margin-right:4px}
.psep{min-height:18px}
.pbtn{font-size:var(--fs-sm);gap:5px;padding:3px 10px;border-radius:6px}
.pbtn svg{width:13px;height:13px}
.pbtn .pluz{width:14px;height:14px}
.pops .opt{font-size:var(--fs-sm);padding:3px 10px;border-radius:6px;gap:5px}.pops .opt svg{width:13px;height:13px}
@media (max-width:700px){.ptab{padding:5px 12px 6px}}
.xgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.xgrid .xwide{grid-column:1/-1}
@media (max-width:900px){.xgrid{grid-template-columns:1fr}}
.xs{font-size:var(--fs-sm);margin:-4px 0 8px}
.xh{display:grid;gap:6px}
.xhr{display:grid;grid-template-columns:minmax(90px,200px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:var(--fs-base)}
.xhl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xhl small{display:block;font-size:var(--fs-xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis}
/* etapa de los equipos: mismo formato compacto que el avance por coordinador */
#x-est .xh{gap:0}
#x-est .xhr{grid-template-columns:minmax(120px,190px) minmax(0,1fr) 8.5rem;gap:10px;padding:4px 6px;border-bottom:1px solid var(--line);line-height:1.2}
#x-est .xhr:last-child{border-bottom:0}
#x-est .xhl{font-weight:700}
#x-est .xhl small{font-weight:400;margin-top:1px}
#x-est .xht{height:10px!important}
#x-est .xhr b{text-align:right}
#x-estu{margin-bottom:4px}
.xht{position:relative;height:14px;border-radius:5px;background:var(--sunk);overflow:hidden}
.xht > i:first-child{display:block;height:100%;border-radius:5px}
.xhr b{font-size:var(--fs-base);white-space:nowrap}
.xdon{display:flex;flex-wrap:wrap;align-items:center;gap:18px}
.xleg{display:grid;gap:6px;font-size:var(--fs-base)}
.xleg>span{display:grid;grid-template-columns:12px 1fr auto 3.2rem;gap:8px;align-items:center}
.xleg i{width:12px;height:12px;border-radius:3px}
.xleg em{font-style:normal;color:var(--muted);text-align:right}
.xleg .xlt{line-height:1.2}.xleg .xlt b{color:var(--ink)}
#x-don .xleg>span{grid-template-columns:12px 1fr 3rem}
.xdoneq{margin:8px 0 0;padding:6px 10px;background:var(--sunk);border-radius:8px;font-size:var(--fs-sm)}
.xdoneq:empty{display:none}
.xleg b small{font-size:var(--fs-xs);font-weight:500;color:var(--muted)}
.xdonu{margin:2px 0 6px;font-size:var(--fs-sm)}
.pcol{width:10px;height:10px;border-radius:3px;flex:none}
details.rules{margin-top:6px!important;padding-top:6px!important}
.ttalert{padding:14px 16px;border-left:5px solid var(--amarillo)}
.ttalert.bad{border-left-color:var(--rojo)}.ttalert.ok{border-left-color:var(--verde)}
.ttalert h2{font-size:var(--fs-md);margin-bottom:6px}.ttalert ul{margin:0 0 6px;padding-left:20px;display:grid;gap:4px;font-size:var(--fs-base)}
.crow{display:grid;grid-template-columns:40px minmax(110px,170px) minmax(0,1fr) 3.2rem;gap:12px;align-items:center;width:100%;padding:7px 6px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:6px}
.crow:last-child{border-bottom:0}
.crow:hover,.crow.on{background:var(--sunk)}
.cav{width:34px;height:34px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:var(--fs-sm);font-weight:800;letter-spacing:.02em}
.cnm{display:grid;min-width:0}.cnm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cnm small{font-size:var(--fs-sm);color:var(--muted)}.cnm em{font-style:normal;color:var(--rojo);font-weight:600}
.cbar{height:12px;border-radius:999px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.cbar i{display:block;height:100%;border-radius:999px}
.cpct{text-align:right;font-size:var(--fs-md)}
.clibtn{background:#1F5FBF;color:#fff;border-color:#1F5FBF}.clibtn:hover{background:#1A4FA0}
.cdlg{position:fixed;z-index:32;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sphead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sppill{font-weight:800;font-size:var(--fs-md);padding:4px 10px;border-radius:8px}
.sppill.up{background:#DDF2E3;color:#1E7A3E}.sppill.down{background:#FBE3E1;color:#B3261E}
.spg{display:flex;align-items:center;gap:14px;flex-wrap:nowrap;margin:2px 0 10px}
.spbig{display:grid}.spbig b{font-size:var(--fs-2xl);font-stretch:80%;font-weight:800;line-height:1}.spbig span{font-size:var(--fs-base);color:var(--muted)}.spbig em{font-style:normal;font-weight:700;font-size:var(--fs-base)}
.spbars{position:relative;display:grid;gap:5px;margin-top:22px}
.spb{position:relative;height:14px;border-radius:7px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);overflow:visible}
.spb i{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.spb.gray{height:8px}.spb.gray i{background:#9AA6B2}
.spflag{position:absolute;right:-2px;top:-14px;font-size:14px;color:var(--muted)}
.sphoy{position:absolute;top:0;bottom:-6px;width:2px;background:var(--ink);opacity:.7}

.tscroll{overflow:auto;max-height:min(68vh,620px);overscroll-behavior:auto}
html{overflow-x:clip}
table{border-collapse:collapse;width:100%;font-size:var(--fs-base)}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap;line-height:1.3}
th{position:sticky;top:0;z-index:3;background:var(--surface);box-shadow:inset 0 -1px 0 var(--line);font-weight:650;user-select:none;font-size:var(--fs-base);color:var(--muted)}
.thw{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.thl{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;font-weight:650}
.fbtn{flex:none;width:18px;height:18px;padding:0;cursor:pointer;display:inline-grid;place-items:center;border-radius:2px;border:1px solid color-mix(in srgb,var(--muted) 55%,transparent);background:linear-gradient(var(--surface),var(--sunk));color:color-mix(in srgb,var(--muted) 80%,var(--ink,#000))}
.fbtn:hover{border-color:var(--accent);background:var(--sunk)}
.fbtn.on{color:var(--accent);border-color:var(--accent);background:var(--sunk)}
.colpop{position:fixed;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:10px;display:grid;gap:8px;font-size:var(--fs-base)}
.cp-sort{display:flex;gap:6px;flex-wrap:wrap}
.cp-all{display:flex;gap:6px;align-items:center;padding:2px 2px 6px;border-bottom:1px solid var(--line)}
.cp-list{max-height:240px;overflow:auto;display:grid;gap:2px}
.cp-list label{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;padding:3px 2px;border-radius:4px;cursor:pointer}
.cp-list label:hover{background:var(--sunk)}
.cp-list span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-list em{font-style:normal;color:var(--muted);font-size:var(--fs-sm)}
.cp-act{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.cp-menu{display:grid;gap:1px;border-bottom:1px solid var(--line);padding-bottom:6px}
.cp-mi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:4px;padding:5px 6px;cursor:pointer;font:inherit;color:inherit}
.cp-mi:hover:not(:disabled){background:var(--sunk)}
.cp-mi:disabled{opacity:.45;cursor:default}
.cp-mi svg{flex:none;color:var(--muted)}
.cp-cond{border-bottom:1px solid var(--line);padding-bottom:6px}
.cp-cond summary{cursor:pointer;padding:5px 6px;border-radius:4px;list-style:none;display:flex;justify-content:space-between}
.cp-cond summary::-webkit-details-marker{display:none}
.cp-cond summary:hover{background:var(--sunk)}
.cp-cond[open] summary{font-weight:600}
.cp-cbody{display:grid;gap:6px;padding:6px 2px 2px}
.cp-cbody select,.cp-cbody input{width:100%;font:inherit;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:inherit}
.cp-cbody .cp-y{display:none;align-items:center;gap:6px}
.cp-cbody .cp-y.on{display:flex}
.cp-list .cp-grp{font-weight:600;background:var(--sunk)}
.cp-list label.cp-sub{padding-left:18px}
.cp-on{font-size:var(--fs-sm);color:var(--accent);padding:0 6px}
.lastrec{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:var(--fs-base);display:grid;gap:3px}
.lastrec .lt{font-weight:700}
.datesbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;align-items:start}
.datesbox .dcol{display:grid;gap:2px;font-size:var(--fs-base)}
.datesbox .dcol b{font-size:var(--fs-md)}
.datesbox #drep{grid-column:1/-1;justify-self:start}
.reptag{font-size:var(--fs-sm);font-weight:600;color:var(--rojo)}
.repform{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.hlog li.hrep{color:var(--ink)}
.hlog li.hrep b{color:var(--rojo)}
th.sorted{color:var(--ink)}
td.wrapc{max-width:280px;overflow:hidden;text-overflow:ellipsis}
td.selc,th.selc{position:sticky;left:0;z-index:2;background:var(--surface);width:34px;min-width:34px;max-width:34px;padding:5px 0 5px 10px}
th.selc{z-index:4}
td.semc,th.semc{position:sticky;left:34px;z-index:2;background:var(--surface);min-width:170px;max-width:200px;box-shadow:inset -1px 0 0 var(--line)}
th.semc{z-index:4}
tbody tr:hover td{background:var(--sunk)}
tbody tr.sel td{background:color-mix(in srgb,var(--amarillo) 16%,var(--surface))}
.selc input{width:16px;height:16px;cursor:pointer;margin:0;vertical-align:middle}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--amarillo) 14%,var(--surface))}
.bulk b{margin-right:4px}
.bulk select,.bulk input[type=text]{width:auto;padding:5px 8px}
.bulk input[type=text]{min-width:220px;flex:1}
tbody tr{cursor:pointer}

td.num,th.num{text-align:right}
.why{font-size:var(--fs-sm);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;display:inline-block;vertical-align:middle}
.pbar{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line);vertical-align:2px;margin-right:6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.savebar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:10px 14px;margin-bottom:14px;border-left:5px solid var(--amarillo)}
.savebar.ok{border-left-color:var(--verde)}
.savebar.ok.mini{display:inline-flex;width:auto;padding:3px 10px;margin-bottom:10px;border-left-width:3px;font-size:var(--fs-sm);color:var(--muted);border-radius:6px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Panel lateral */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:31;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.edbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sunk)}.edbox summary{cursor:pointer;font-weight:700}.edbox .edgrid{display:grid;gap:10px;margin-top:10px}.edbox .edgrid .f{padding-bottom:8px;border-bottom:1px solid var(--line)}body.ro .drawer .edbox{pointer-events:none;opacity:.65}
.drawer .body{padding:14px 16px;overflow:auto;display:grid;gap:12px;align-content:start}
.statebox{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:6px;background:var(--sunk)}
.statebox .dot{width:20px;height:20px}
.kv{display:grid;gap:0;font-size:var(--fs-base)}
.kvrow{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:4px 10px;padding:7px 0;border-bottom:1px solid var(--line)}
.kvrow dt{color:var(--muted)} .kvrow dd{margin:0;word-break:break-word}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:var(--fs-base)}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.eqhd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.eqlist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.eqlist table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.eqlist th,.eqlist td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.eqlist th{position:sticky;top:0;background:var(--sunk);z-index:1}
.eqlist select{font-size:var(--fs-sm);padding:2px 4px;max-width:130px}
.eqlist tr.chg td{background:color-mix(in srgb,var(--amarillo) 14%,transparent)}
.seg.vista{display:inline-flex}
body.ro .drawer .eqlist select{pointer-events:none;opacity:.65}
.objbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px}
.objbox input{font-size:var(--fs-lg);font-weight:700}
.objbox input:disabled{opacity:.45}
.objfix{font-size:var(--fs-lg);font-weight:700;padding:7px 9px;border:1px dashed var(--line);border-radius:6px;color:var(--ink)}
.objpct{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.pbar.wide{flex:1;width:auto;height:10px;margin:0}
.objpct b{font-size:var(--fs-md);min-width:3.2rem;text-align:right}
.acceptbar{display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);padding:10px 0;border-top:1px solid var(--line)}
.acceptbar .btn{padding:10px 16px}
.formerr{color:var(--rojo);font-weight:600;font-size:var(--fs-base);margin:0}
.formerr:empty{display:none}
.hlog{margin:0;padding-left:18px;font-size:var(--fs-base);display:grid;gap:4px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}

/* ===== Tipografía homogénea: un solo tamaño por nivel en todo el sistema ===== */
#app h2,.ttalert h2,.panel h2{font-size:var(--fs-md)!important;line-height:1.2;font-weight:750;font-stretch:80%;letter-spacing:.005em}
#app h3{font-size:var(--fs-md)!important;line-height:1.25}
#app .card p.muted,#app .card .muted.xs,#app .card .xs{font-size:var(--fs-base)!important;line-height:1.45}
#app .bofh>span.muted,#app .bofh>span:not(.bochips):not(.velst):not(.sppill),#app .tfilters .count,#app .clsec .bofh>span{font-size:var(--fs-base)!important}
/* Indicadores (resumen y tablero) ligeramente más compactos; los del Back Office ya lo son */
.kpis:not(.bofin .kpis){gap:10px}
.kpi:not(.bofin .kpi){padding:11px 14px}
.kpi:not(.bofin .kpi) .kt{font-size:var(--fs-xs)}
.kpi:not(.bofin .kpi) b{font-size:var(--fs-xl)}
.kpi:not(.bofin .kpi) .ks{font-size:var(--fs-sm);line-height:1.35}
/* ===== Prospectos ===== */
.prhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:10px}
.prhead p{margin:2px 0 0}
.prtabs b{margin-left:6px;font-weight:700;color:var(--muted)}
.prtabs .on b{color:inherit}
.prnote{border:1px dashed #E9B10A;background:#FFFBEB;color:#713F12;border-radius:10px;padding:10px 14px;font-size:var(--fs-base);margin-bottom:12px}
.prtool{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 12px}
.prtool input[type=search],.prtool select{font:inherit;font-size:var(--fs-base);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.prtool input[type=search]{flex:1 1 280px;max-width:420px}
.prtool input[type=search]:focus{outline:none;border-color:#5B9BFF;box-shadow:0 0 0 3px color-mix(in srgb,#5B9BFF 25%,transparent)}
.prtool select{width:auto;min-width:180px}
.prsp{flex:1}
.prgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.prc{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;box-shadow:0 8px 20px -14px rgba(15,39,71,.35);overflow:hidden}
.prc::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--pc)}
.prc.edit{cursor:pointer;transition:box-shadow .15s,transform .15s}
.prc.edit:hover,.prc.edit:focus-visible{box-shadow:0 12px 26px -14px rgba(15,39,71,.5);transform:translateY(-1px)}
.prh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prcli{font-size:var(--fs-base);font-weight:700;color:var(--pc)}
.prst{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.prst i{width:7px;height:7px;border-radius:50%}
.prt{font-size:var(--fs-md);font-weight:750;font-stretch:85%;line-height:1.25;color:var(--ink)}
.pra{margin:0;font-size:var(--fs-base);color:var(--muted);line-height:1.4}
.prf{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:var(--fs-sm);color:var(--muted)}
.prf b{font-size:var(--fs-lg);font-weight:800;color:#1F5FBF;letter-spacing:-.01em;white-space:nowrap}
.prbar{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2F78E8,#1A4FB8)}
.prft{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:var(--fs-sm);color:var(--muted)}
.prbaja{font-size:var(--fs-sm);color:#B91C1C;background:#FFF1F2;border-radius:8px;padding:5px 8px}
.prdlg{width:min(640px,94vw)}
.prform{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:10px}
.prform .full{grid-column:1/-1}
.prform textarea{min-height:64px}
.primp b{font-size:var(--fs-lg);color:#1F5FBF}
@media (max-width:640px){ .prform{grid-template-columns:1fr} .prtool .prsp{display:none} }
/* Archivar por término y Proyectos concluidos */
.finbtn{border-color:#15803D;color:#15803D;font-weight:700}
.finbtn:hover{background:#DCF5E5}
.finbtn.ready{background:#15803D;border-color:#15803D;color:#fff;box-shadow:0 6px 14px -8px rgba(21,128,61,.8)}
.finbtn.ready:hover{background:#116A33}
.sitem svg{flex:none}
.sitem{text-align:left;line-height:1.25}
.sitem .scnt{margin-left:auto;font-size:var(--fs-sm);font-weight:800;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px}
.arcc .prf b{font-size:var(--fs-xl)}
.arcact{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.arcproject{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,1.8fr);gap:16px;align-items:start;grid-column:1/-1}
.arcproject>.prc{min-width:0}
.arcproject>.pdc{min-width:0;margin:0}
.arcproject .pdr{grid-template-columns:22px minmax(92px,1fr) 84px minmax(104px,1fr) 40px 92px minmax(100px,1.3fr)}
.arcproject .pdk{grid-template-columns:repeat(5,minmax(0,1fr))}
.arcdv{margin-top:4px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);font-size:var(--fs-base)}
.arcdv summary{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;font-weight:700;color:var(--ink)}
.arcdv summary::marker{color:#B45309}
.arcdvtag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;background:#FEF3C7;color:#92400E;font-size:var(--fs-sm);font-weight:800}
.arcdvbody{display:grid;gap:8px;padding:0 10px 10px}
.arcdvitem{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.arcdvitem h3{font-size:var(--fs-base);margin-bottom:5px}
.arcdvitem p{margin:3px 0;color:var(--muted);line-height:1.4}
.arcdvitem b{color:var(--ink)}
@media(max-width:1050px){.arcproject{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){.arcproject .pdk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:1400px){.arcproject .pdk{grid-template-columns:repeat(2,minmax(0,1fr))}.arcproject .pdr{grid-template-columns:22px minmax(84px,1fr) 80px minmax(96px,1fr) 30px 92px}.arcproject .pdr .pdno{grid-column:2/-1;padding-bottom:2px}}
@media(max-width:720px){.arcproject .pdr{grid-template-columns:22px minmax(0,1fr) 84px}.arcproject .pdr .pdd,.arcproject .pdr .pdtr,.arcproject .pdr .pdl{display:none}.arcproject .pdr .pdno{grid-column:2/-1}}
.prenv{font-size:var(--fs-sm);font-weight:700;color:#6D28D9;background:#F5F3FF;border-radius:8px;padding:4px 8px;align-self:flex-start}
.prdlg input:not([type]),.prdlg input[type=text],.prdlg input[type=date],.prdlg input[type=number],.prdlg select,.prdlg textarea{font:inherit;font-size:var(--fs-base);width:100%;box-sizing:border-box;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink)}
.prdlg input:focus,.prdlg select:focus,.prdlg textarea:focus{outline:none;border-color:#5B9BFF;box-shadow:0 0 0 3px color-mix(in srgb,#5B9BFF 25%,transparent)}
.primp{display:grid;gap:2px}
.prmbw{display:grid;grid-template-columns:1.4fr 1fr;gap:10px 12px}
.prmot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:-2px 0 12px;font-size:var(--fs-base);color:var(--muted)}
.prmot span{background:#FFF1F2;color:#9F1239;border:1px solid #FECDD3;border-radius:999px;padding:3px 10px;font-weight:600}
.prmot span b{margin-left:4px}
@media (max-width:640px){ .prmbw{grid-template-columns:1fr} }

/* ===== Menú lateral: vidrio sobre fondo de circuito ===== */
.side{gap:10px;padding:18px 14px calc(18px + env(safe-area-inset-bottom,0px));color:#E6F0FA;
  background:#17222E}
.side .sbrand,.side .sgroup,.side .rolebox,.side .sbtn.new{
  background:linear-gradient(180deg,rgba(255,255,255,.11),rgba(255,255,255,.05));
  border:1px solid rgba(190,220,255,.22);border-radius:16px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 28px -14px rgba(0,0,0,.7)}
.side .sbrand{align-items:center;text-align:center;padding:14px 12px;border-bottom:1px solid rgba(190,220,255,.22)}
.side .sbrand span{font-size:var(--fs-lg);line-height:1.15;color:#CFE6FF;text-shadow:0 0 18px rgba(90,170,255,.55)}
.side .sbtn.new{display:grid;justify-items:center;gap:1px;margin:0;padding:11px 12px;text-align:center;font-size:var(--fs-md);color:#fff}
.side .sbtn.new small{font-size:var(--fs-sm);font-weight:600;color:#B9D3EE}
.side .sbtn.new:hover{background:linear-gradient(180deg,rgba(120,180,255,.28),rgba(120,180,255,.12));border-color:rgba(160,205,255,.5)}
.side .sgroup{display:grid;gap:7px;padding:10px 10px 12px}
.side .sgroup .slabel{padding:2px 4px 2px}
.side .slabel{color:#A9C4E0;letter-spacing:.1em}
.side .sitem{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid rgba(190,220,255,.18);border-radius:12px;padding:10px 12px;color:#E6F0FA}
.side .sitem:hover{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.06));border-color:rgba(190,220,255,.35)}
.side .sitem.on{background:linear-gradient(180deg,rgba(110,175,255,.34),rgba(80,150,255,.16));border-color:rgba(160,210,255,.6);color:#fff;box-shadow:0 0 0 1px rgba(120,190,255,.15),0 0 18px -4px rgba(90,170,255,.7)}
.side .sitem svg{color:#BFDCFF}
.side .scnt{background:rgba(255,255,255,.14);border:1px solid rgba(190,220,255,.25);color:#fff}
.side .sacts{display:flex;align-items:center;justify-content:space-between;padding:10px 6px 2px;font-size:var(--fs-sm)}
.side .sacts .scnt{font-size:var(--fs-sm);font-weight:800;border-radius:8px;padding:2px 9px;letter-spacing:0}
.side .sclient{color:#8EC1FF}
.side .sp{border-radius:10px;color:#DCE8F4}
.side .sp:hover{background:rgba(255,255,255,.08)}
.side .sp.on{background:rgba(110,175,255,.24);box-shadow:inset 0 0 0 1px rgba(160,210,255,.4)}
.side .rolebox{padding:12px;gap:8px}
.side .rolebox.ro{background:linear-gradient(180deg,rgba(255,214,102,.16),rgba(255,214,102,.06));border-color:rgba(255,214,102,.35)}
.side .ruser{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(190,220,255,.16)}
.side .ruser>div{display:grid;min-width:0}

<script>

/* ================== Almacenamiento ================== */
const IDX='tablero:index', PK=id=>'tablero:p:'+id;
let memStore={}, storeOK=true;
function lsGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ storeOK=false; return memStore[k]||null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ storeOK=false; memStore[k]=v; toast('No se pudo guardar en este navegador. Descarga el Excel para no perder cambios.'); } }
/* Los proyectos se guardan en IndexedDB (cientos de MB); en memoria solo el proyecto abierto. */
const DBN='tablero-datos'; let _db=null; const projCache={};
function dbOpen(){ if(_db) return Promise.resolve(_db); return new Promise((res,rej)=>{ try{ const r=indexedDB.open(DBN,1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{ _db=r.result; res(_db); }; r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
async function dget(k){
  if(projCache[k]) return projCache[k];
  try{ const db=await dbOpen(); const v=await new Promise((res,rej)=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); });
    if(v){ Object.keys(projCache).forEach(x=>delete projCache[x]); projCache[k]=v; return v; } }catch(e){}
  return lsGet(k);
}
async function dread(k){ if(projCache[k]) return projCache[k]; try{ const db=await dbOpen(); return await new Promise(res=>{ const q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return lsGet(k); } }
async function bundle(){ // todos los proyectos para guardarlos juntos en el archivo
  const out=[]; for(const x of listProjects()){ const pr=(P&&x.id===P.id)?P:await dread(PK(x.id)); if(pr){ const c=JSON.parse(JSON.stringify(pr)); c.dirty=false; out.push(c); } }
  if(P&&!out.some(x=>x.id===P.id)){ const c=JSON.parse(JSON.stringify(P)); c.dirty=false; out.unshift(c); }
  return {multi:true,current:P?P.id:null,projects:out,auth:AUTH||undefined};
}
function dput(k,v){
  Object.keys(projCache).forEach(x=>{ if(x!==k) delete projCache[x]; }); projCache[k]=v;
  if(typeof SERVER!=='undefined'&&SERVER) return; // en modo programa la base de datos es el servidor
  dbOpen().then(db=>{ const tx=db.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k);
    tx.onabort=tx.onerror=()=>toast('El navegador se quedó sin espacio. Descarga el Excel y archiva o borra proyectos terminados.'); })
  .catch(()=>lsSet(k,v));
}
function ddel(k){ delete projCache[k]; dbOpen().then(db=>db.transaction('kv','readwrite').objectStore('kv').delete(k)).catch(()=>{}); try{ localStorage.removeItem(k); }catch(e){} }
async function migrateLocal(){ // pasa los proyectos que estaban en el espacio chico (5 MB) al grande
  try{ const ks=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('tablero:p:')) ks.push(k); }
    if(!ks.length) return; const db=await dbOpen();
    for(const k of ks){ const v=JSON.parse(localStorage.getItem(k)); await new Promise((res,rej)=>{ const tx=db.transaction('kv','readwrite'); const st=tx.objectStore('kv'); const g=st.get(k); g.onsuccess=()=>{ if(!g.result||(g.result.updated||'')<(v.updated||'')) st.put(v,k); }; tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); localStorage.removeItem(k); }
  }catch(e){}
}
function sget(k){ return k.startsWith('tablero:p:')?(projCache[k]||null):lsGet(k); }
function sset(k,v){ if(k.startsWith('tablero:p:')) return dput(k,v); lsSet(k,v); }
function sdel(k){ if(k.startsWith('tablero:p:')) return ddel(k); try{ localStorage.removeItem(k); }catch(e){} }
async function storageInfo(){ try{ if(!navigator.storage||!navigator.storage.estimate) return null; const e=await navigator.storage.estimate(); return {used:e.usage||0,quota:e.quota||0}; }catch(e){ return null; } }
const fmtMB=b=>b>=1e9?(b/1e9).toFixed(1)+' GB':(b/1e6).toFixed(b<1e7?1:0)+' MB';

function anularDialog(pid,rid,done){

    <label class="f"><span>¿Cuál fue el error? (obligatorio)</span><textarea id="anr" maxlength="1000" placeholder="Ej. Se capturó en el sitio equivocado; el retraso era de otro registro."></textarea></label>
    <p class="formerr" id="anerr" role="alert"></p>
    <div class="acceptbar" style="position:static;margin-top:10px"><button class="btn" id="an0">Cancelar</button><button class="btn danger" id="an1">Anular desviación</button></div>`;
  document.body.append(sc,d); const close=()=>{ sc.remove(); d.remove(); }; sc.onclick=close; d.querySelector('#an0').onclick=close; d.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); }); d.querySelector('#anr').focus();
  d.querySelector('#an1').onclick=async()=>{ const razon=d.querySelector('#anr').value.trim(), err=d.querySelector('#anerr'), b=d.querySelector('#an1');
    if(!razon){ err.textContent='Escribe cuál fue el error.'; d.querySelector('#anr').focus(); return; }
    b.disabled=true; err.textContent='';
    try{ await api('POST','desviaciones/'+encodeURIComponent(pid)+'/anular',{fila:rid,razon});
      // si el proyecto está abierto, se vuelve a leer para no pisar la anulación al guardar después
      if(P&&P.id===pid){ try{ const pd=await api('GET','proyectos/'+encodeURIComponent(pid)); if(P&&P.id===pid&&!P.dirty){ const keepCorte=P.corte; srvVer[pid]=pd.version; P=pd.data; P.corte=keepCorte; P.dirty=false; P.cfg.th=Object.assign({},DEF_TH,P.cfg.th); sset(PK(pid),P); } }catch(_){} }
      close(); toast('Desviación de '+rid+' anulada. Ya no cuenta en el área; queda en el historial.'); if(done) done();
    }catch(e){ err.textContent=(e.data&&e.data.error)||'No se pudo anular. Intenta de nuevo.'; b.disabled=false; } };
}

async function archiveProject(id,on,reason){
  let p=null, ver=0;
  try{ if(SERVER){ const d=await api('GET','proyectos/'+encodeURIComponent(id)); p=d.data; ver=d.version; } else p=await dget(PK(id)); }catch(e){}
  if(!p){ toast('No encontré ese proyecto.'); return; }
  if(on){ const prev=P; P=p; P.cfg.th=Object.assign({},DEF_TH,P.cfg.th); try{ await exportExcel(); }catch(e){} P=prev; }
  p.archived=!!on; if(on){ p.archiveReason=reason||'concluido'; p.archivedAt=new Date().toISOString(); } else { delete p.archiveReason; delete p.archivedAt; }
  if(SERVER){ try{ await api('PUT','proyectos/'+encodeURIComponent(id),{data:p,base:ver}); await refreshList(); }catch(e){ toast('No se pudo cambiar el proyecto.'); return; } }
  else { dput(PK(id),p); const l=listProjects().map(x=>x.id===id?{...x,archived:!!on,archReason:on?p.archiveReason:undefined}:x); sset(IDX,l); }
  if(on&&P&&P.id===id){ P=null; ui.view='home'; }
  render(); toast(on?'Proyecto archivado como '+ARCH_R[p.archiveReason][0].toLowerCase()+'. Se descargó su Excel como respaldo.':'Proyecto reactivado.');
}

function saveProject(p){
  if(typeof isRO==='function'&&isRO()) return;

  const tot=totals(p); p.hist=p.hist||{}; p.hist[todayISO()]=tot.done; // histórico diario del avance real
  sset(PK(p.id),p);
  if(!p.color||!PALETA.includes(p.color)) p.color=colorFor(p.id);
  const sm=computeSummary(p); const l=listProjects().filter(x=>x.id!==p.id); l.unshift({id:p.id,name:p.name,updated:p.updated,n:p.rows.length,archived:!!p.archived,archReason:p.archiveReason,color:p.color,sum:sm}); sset(IDX,l);

function toISO(v){
  if(v===null||v===undefined||v==='') return null;
  if(typeof v==='number'){ if(v>20000&&v<80000){ const d=new Date(Date.UTC(1899,11,30)+Math.floor(v+1e-6)*86400000); return d.toISOString().slice(0,10);} return null; }
  const s=String(v).trim(); let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){ const y=m[3].length===2?'20'+m[3]:m[3]; return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
  return null;
}

  const top=c=>{ const n={}; table.rows.forEach(r=>{ const v=r[c]; if(v!==undefined&&String(v).trim()!=='') n[String(v).trim()]=(n[String(v).trim()]||0)+1; }); return Object.keys(n).sort((a,b)=>n[b]-n[a])[0]; };

function ttCheck(table,sheet){
  const have=new Set(table.cols.map(ttKey)), miss=TT_COLS.filter(c=>!have.has(ttKey(c))), crit=miss.filter(c=>TT_CRIT.includes(c));

/* ================== Lectura de Excel ================== */
function readFile(file){
  return new Promise((res,rej)=>{
    if(!window.XLSX){ rej(new Error('No se pudo cargar el lector de Excel. Revisa tu conexión a internet.')); return; }
    const r=new FileReader();
    r.onload=e=>{ try{ res(XLSX.read(new Uint8Array(e.target.result),{type:'array'})); }catch(err){ rej(err); } };
    r.onerror=()=>rej(new Error('No se pudo leer el archivo.'));
    r.readAsArrayBuffer(file);
  });
}
function sheetTable(wb,name){
  const aoa=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:null,blankrows:false});
  let best=0,bestScore=-1;
  for(let i=0;i<Math.min(20,aoa.length);i++){
    const row=aoa[i]||[]; const strs=row.filter(c=>typeof c==='string'&&c.trim()).length;
    const syn=row.filter(c=>typeof c==='string'&&FIELDS.some(f=>f.syn.includes(norm(c)))).length;
    const sc=strs+syn*5; if(sc>bestScore){bestScore=sc;best=i;}
  }
  const raw=aoa[best]||[]; const seen={};
  const cols=raw.map((h,i)=>{ let n=(h===null||h===undefined||String(h).trim()==='')?'Columna '+(i+1):String(h).trim(); if(typeof h==='number') n='Col '+h; if(seen[n]){seen[n]++; n=n+' ('+seen[n]+')';} else seen[n]=1; return n; });
  const rows=aoa.slice(best+1).filter(r=>r&&r.some(c=>c!==null&&String(c).trim()!=='')).map(r=>{ const o={}; cols.forEach((c,i)=>{ const v=r[i]; if(v!==null&&v!==undefined&&String(v).trim()!=='') o[c]=typeof v==='string'?v.trim():v; }); return o; });
  return {cols,rows};
}
/* Sábana desglosada (una fila por lectora/equipo): se agrupa en un registro por CR O ID */
function groupBySite(table){
  if(tipoPorCols(table.cols)) return table; // cada fila es una actividad con su propia clave; CR O ID es el sitio
  const cid=table.cols.find(c=>ttKey(c)==='cr o id'); if(!cid) return table;
  const perItem=table.cols.some(c=>/^folio g(pl|lp)i$/.test(norm(c))||/equipos intervenidos$/.test(norm(c))&&!/^cantidad/.test(norm(c)));
  const ids=table.rows.map(r=>r[cid]).filter(v=>v!==undefined).map(v=>String(v).trim());
  if(!perItem||ids.length===new Set(ids).size) return table;
  const kind=c=>{ const n=norm(c);
    if(/^cantidad de equipos|^equipos ejecutados$/.test(n)) return 'sum';
    if(/^fecha de inicio$/.test(n)) return 'min';
    if(/^fecha (final|reprogramada|final reprogramada)$/.test(n)) return 'max';
    if(n.startsWith('estatus operativo')) return 'st';
    if(/folio|modelo|serie|activo|comentario|descr|inventario|documentacion/.test(n)) return 'list';
    return 'first'; };
  const K={}; table.cols.forEach(c=>K[c]=kind(c));
  const groups=new Map(); table.rows.forEach(r=>{ const v=r[cid]; const k=v===undefined?'\u0000'+groups.size:String(v).trim(); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r); });
  const stOf=list=>{ const vals=list.filter(v=>v!==undefined).map(String); if(!vals.length) return undefined; if(new Set(vals).size===1) return vals[0];
    return siteStFrom(vals.map(v=>normStatus(v)).filter(Boolean))||vals[0]; };
  // filas marcadas "ADICIONADOS" (equipos de más que pidió el cliente): no suman a la meta, sí a los ejecutados → quedan como adicionales
  const cdesc=table.cols.filter(c=>/descr|equipos intervenidos$/.test(norm(c))&&!/^cantidad/.test(norm(c)));
  const isAdd=r=>cdesc.some(c=>/adicion/.test(norm(r[c])));
  // equipos cancelados (una fila con estatus cancelado): no suman a la meta del sitio, se cuentan aparte; si todo el sitio se canceló, conserva su cantidad
  const cstG=table.cols.find(c=>norm(c).startsWith('estatus operativo')), isCan=r=>cstG&&normStatus(r[cstG])==='Cancelado';
  const rows=[...groups.values()].map(g=>{ const o={}, allCan=g.every(isCan), drop=r=>isAdd(r)||(!allCan&&isCan(r));
    table.cols.forEach(c=>{ const src=K[c]!=='sum'?g:/^cantidad de equipos/.test(norm(c))?g.filter(r=>!drop(r)):g.filter(r=>!isCan(r)); // un equipo cancelado nunca cuenta como ejecutado
    const vs=src.map(r=>r[c]).filter(v=>v!==undefined&&String(v).trim()!==''); if(!vs.length){ if(K[c]==='sum'&&g.some(r=>r[c]!==undefined)) o[c]=0; return; }
    const k=K[c];
    if(k==='sum') o[c]=vs.reduce((a,v)=>a+num(v),0);
    else if(k==='min'||k==='max'){ const ns=vs.filter(v=>typeof v==='number'); o[c]=ns.length?(k==='min'?Math.min(...ns):Math.max(...ns)):vs[0]; }
    else if(k==='st') o[c]=stOf(vs);
    else if(k==='list') o[c]=[...new Set(vs.map(v=>String(v).trim()))].join(', ');
    else o[c]=vs[0]; });
    // estatus de cada folio GLPI (una fila = una lectora), para documentar cada ticket con lo suyo
    const cfo=table.cols.find(c=>/^folios? g(pl|lp)i$/.test(norm(c))), cst=table.cols.find(c=>norm(c).startsWith('estatus operativo')), cej=table.cols.find(c=>norm(c)==='equipos ejecutados');
    if(cfo){ const fl=[]; g.forEach(r=>{ (String(r[cfo]??'').match(/\b\d{3,9}\b/g)||[]).forEach(f=>fl.push({folio:f,st:String(r[cst]??''),ej:num(r[cej]),desc:String(cdesc.map(c=>r[c]).find(v=>v!==undefined)??''),add:isAdd(r)})); });
      Object.defineProperty(o,'_folios',{value:fl,enumerable:false}); }
    // cada línea de la sábana = un equipo, con su propio estatus
    const LC=table.cols.filter(c=>K[c]==='list'), cq0=table.cols.find(c=>/^cantidad de equipos/.test(norm(c)));
    if(cst||cfo){ const ln=g.map(r=>{ const x={}; LC.forEach(c=>{ const v=r[c]; if(v!==undefined&&String(v).trim()!=='') x[c]=typeof v==='string'?v.trim():v; });
        return {folio:cfo?String(r[cfo]??'').trim():'',st:cst?(normStatus(r[cst])||''):'',ej:cej?num(r[cej]):0,cant:cq0&&r[cq0]!==undefined?num(r[cq0]):1,add:isAdd(r),x}; });
      Object.defineProperty(o,'_lineas',{value:ln,enumerable:false}); }
    const ccan=table.cols.find(c=>/^cantidad de equipos/.test(norm(c))), nCan=allCan?0:g.filter(r=>isCan(r)&&!isAdd(r)).reduce((a,r)=>a+(ccan?num(r[ccan])||1:1),0);
    Object.defineProperty(o,'_cancel',{value:nCan,enumerable:false});
    if(cstG){ const stc={}; g.forEach(r=>{ const k=normStatus(r[cstG])||'Sin estatus'; stc[k]=(stc[k]||0)+1; }); Object.defineProperty(o,'_stc',{value:stc,enumerable:false}); }
    return o; });
  return {cols:table.cols,rows,grouped:{from:table.rows.length,to:rows.length,adic:table.rows.filter(isAdd).length}};
}
function scoreSheet(wb,name){ try{ const t=sheetTable(wb,name); const m=autoMap(t.cols); let u=0,dup=0;
  if(m.id){ const ids=t.rows.map(r=>r[m.id]).filter(v=>v!==undefined).map(String); u=new Set(ids).size; dup=ids.length-u; }
  return Object.values(m).filter(Boolean).length*1000+u-dup*2; }catch(e){ return -1e9; } }
function autoMap(cols){
  const m={}, used=new Set(), nc=cols.map(c=>[c,norm(c)]).filter(([c])=>!c.endsWith(SYS_SUFFIX));
  FIELDS.forEach(f=>{
    let hit=null;
    for(const s of f.syn){ const x=nc.find(([c,n])=>n===s&&!used.has(c)); if(x){hit=x[0];break;} }
    if(!hit) for(const s of f.syn){ if(s.length<4) continue; const x=nc.find(([c,n])=>n.includes(s)&&!used.has(c)); if(x){hit=x[0];break;} }
    m[f.k]=hit; if(hit) used.add(hit);
  });
  const tk=tipoPorCols(cols); if(tk) Object.entries(TIPOS[tk].map).forEach(([k,c])=>{ const x=nc.find(([,n])=>n===norm(c)); if(x) m[k]=x[0]; });
  return m;
}

const SMALLW=new Set(['de','del','la','las','el','los','y','e','o','u','en','a','al','con','por','para','sin','sobre','un','una']);
const ACR=new Set(['CDMX','INM','SAT','IMSS','ISSSTE','CFE','TI','IT','ID','CR','RFC','SA','CV','LAN','WAN','UPS','PC','TV','CCTV','GPS','IP','VPN','DVR','NVR','TT','SIX','SAPPA','BBVA','HSBC','ATM','CEDIS','USB','LED','LCD','PEMEX','TELMEX','SCT','SEP','UNAM','IPN','IVA','CP','ISO','SKU','OXXO','IDS','GPLI','SN','QR','DGO','NL','BC','BCS']);
const ROMAN=new Set(['II','III','IV','VI','VII','VIII','IX','XI','XII','XIII','XIV','XV','XX']);
function pretty(s){
  if(typeof s!=='string') return s; if(!/[A-Za-zÁÉÍÓÚÑáéíóúñ]/.test(s)) return s;
  let first=true;
  return s.split(/(\s+|\/|-|\(|\)|,|\.|:)/).map(w=>{
    if(!w||/^(\s+|\/|-|\(|\)|,|\.|:)$/.test(w)) return w;
    const up=w.toLocaleUpperCase('es'), lw=w.toLocaleLowerCase('es'), wasFirst=first; first=false;
    if(/\d/.test(w)) return up;                       // claves como BCN1, CR04
    if(ACR.has(up)||ROMAN.has(up)) return up;          // siglas conocidas
    if(w.length>=2&&w.length<=5&&!/[AEIOUÁÉÍÓÚ]/i.test(w)) return up; // siglas sin vocales (CDMX)
    if(!wasFirst&&SMALLW.has(lw)) return lw;
    return lw.charAt(0).toLocaleUpperCase('es')+lw.slice(1);
  }).join('');
}
function prettyRaw(raw,idCol){ const o={}; Object.keys(raw).forEach(c=>{ const v=raw[c]; o[c]=(c===idCol||typeof v!=='string'||/^estatus operativo|^documentacion/.test(norm(c))&&false)?v:pretty(v); }); return o; }

function migrateCase(p){ if(!p||p.caseV===1) return false; const id=p.cfg&&p.cfg.map&&p.cfg.map.id; (p.rows||[]).forEach(r=>{ r.raw=prettyRaw(r.raw,id); }); if(p.info&&p.info.items) p.info.items.forEach(x=>{ if(typeof x.v==='string') x.v=pretty(x.v); }); p.caseV=1; return true; }

function sema(r){

  if(s.estatus==='En pausa') return {c:'rojo',pct,why:'En pausa'+(s.motivo?': '+s.motivo:(s.incidencia?': '+s.incidencia:'')),late:0};

  const i0=dnum(ini||fin);

  const dur=dnum(fin)-i0+1, esperado=Math.max(0,Math.min(1,(c-i0)/dur)), gap=(esperado-pct)*100;

  if(gap>th.amar) return {c:'amarillo',pct,why:'Lleva '+pctTxt(pct)+', debería llevar '+pctTxt(esperado),late:0};

  return {c:'verde',pct,why:s.estatus==='Proceso'||pct>0?'En tiempo':'En tiempo, inicia hoy o ya puede iniciar',late:0};
}

/* ---------- Velocímetro de alta calidad (colores brillantes, aguja metálica) ---------- */
let GQ=0;
const GQ_SEM=[{a:0,b:2/7,c:['#0B5D2A','#1E9A4B'],l:'En Tiempo'},{a:2/7,b:3/7,c:['#1FAE4B','#8EDB3E'],l:'Al Día'},{a:3/7,b:5/7,c:['#FFE629','#F5B800'],l:'Atención 10-30% abajo'},{a:5/7,b:1,c:['#E8233F','#8E0B1E'],l:'Crítico +30% abajo'}];
function gaugeHQ(segs,val,opt={}){
  const id='gq'+(++GQ), W=420, cx=210, cy=opt.labels===false?200:218, R=150, w=opt.thick||56, Ro=R+w/2, Ri=R-w/2;
  const P2=(f,r)=>{ const a=Math.PI*(1-f); return [cx+r*Math.cos(a),cy-r*Math.sin(a)]; }, f1=v=>v.toFixed(1);
  const arcBand=(a,b)=>{ const [x1,y1]=P2(a,Ro),[x2,y2]=P2(b,Ro),[x3,y3]=P2(b,Ri),[x4,y4]=P2(a,Ri); const lg=(b-a)>0.5?1:0;
    return `M${f1(x1)} ${f1(y1)} A${Ro} ${Ro} 0 ${lg} 1 ${f1(x2)} ${f1(y2)} L${f1(x3)} ${f1(y3)} A${Ri} ${Ri} 0 ${lg} 0 ${f1(x4)} ${f1(y4)}Z`; };
  let defs=`<filter id="${id}sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#000" flood-opacity=".35"/></filter>
    <filter id="${id}gl" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="${id}nd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A949E"/><stop offset=".45" stop-color="#F4F6F8"/><stop offset=".55" stop-color="#C9D0D6"/><stop offset="1" stop-color="#6F7983"/></linearGradient>
    <radialGradient id="${id}hb" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#C5CCD3"/><stop offset="1" stop-color="#5E6872"/></radialGradient>
    <radialGradient id="${id}hi" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#E9EDF1"/><stop offset="1" stop-color="#8C96A0"/></radialGradient>
    <linearGradient id="${id}gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>`;
  let body='';
  segs.forEach((s,i)=>{ const [xa]=P2(s.a,R),[xb]=P2(s.b,R); defs+=`<linearGradient id="${id}s${i}" gradientUnits="userSpaceOnUse" x1="${f1(xa)}" y1="0" x2="${f1(xb)}" y2="0"><stop offset="0" stop-color="${s.c[0]}"/><stop offset="1" stop-color="${s.c[1]}"/></linearGradient>`;
    body+=`<path d="${arcBand(s.a,s.b)}" fill="url(#${id}s${i})"/>`; });
  // brillo superior y bordes
  body+=`<path d="${arcBand(0,1)}" fill="url(#${id}gloss)" opacity=".55"/><path d="${arcBand(0,1)}" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="1.5"/>`;
  segs.slice(1).forEach(s=>{ const [x1,y1]=P2(s.a,Ri),[x2,y2]=P2(s.a,Ro); body+=`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>`; });
  // etiquetas sobre el arco
  if(opt.labels!==false) segs.forEach((s,i)=>{ const r=Ro+14, [x1,y1]=P2(s.a,r),[x2,y2]=P2(s.b,r); defs+=`<path id="${id}t${i}" d="M${f1(x1)} ${f1(y1)} A${r} ${r} 0 0 1 ${f1(x2)} ${f1(y2)}"/>`;
    body+=`<text font-size="${opt.lfs||15}" font-weight="700" fill="${opt.lcol||'#1B1F24'}" letter-spacing=".2"><textPath href="#${id}t${i}" startOffset="50%" text-anchor="middle">${esc(s.l)}</textPath></text>`; });
  // marca de lo esperado
  if(opt.mark!=null&&opt.mark>0){ const [x1,y1]=P2(Math.min(1,opt.mark),Ri-4),[x2,y2]=P2(Math.min(1,opt.mark),Ro+4); body+=`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}" stroke="#111827" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round"><title>${esc(opt.markT||'')}</title></line>`; }
  // aguja metálica
  const v=Math.max(0,Math.min(1,val)), ang=180*(1-v), L=R+w/2-8;
  body+=`<g transform="rotate(${(-ang).toFixed(2)} ${cx} ${cy})" filter="url(#${id}sh)"><path d="M${cx} ${cy-9} L${cx+L} ${cy-1.6} Q${cx+L+5} ${cy} ${cx+L} ${cy+1.6} L${cx} ${cy+9} Z" fill="url(#${id}nd)" stroke="#5B656F" stroke-width=".8"/><line x1="${cx+18}" y1="${cy-2}" x2="${cx+L-10}" y2="${cy-1}" stroke="#fff" stroke-opacity=".7" stroke-width="1.2"/></g>
    <circle cx="${cx}" cy="${cy}" r="22" fill="url(#${id}hb)" filter="url(#${id}sh)"/><circle cx="${cx}" cy="${cy}" r="11" fill="url(#${id}hi)" stroke="#6F7983" stroke-width="1"/>`;
  if(opt.center) body+=`<text x="${cx}" y="${cy+56}" text-anchor="middle" font-size="${opt.cfs||40}" font-weight="800" fill="#0F172A">${esc(opt.center)}</text>`;
  const H=cy+(opt.center?66:30);
  return `<svg viewBox="-8 ${opt.labels===false?14:-6} ${W+16} ${H-(opt.labels===false?14:-6)}" width="100%" style="max-width:${opt.max||420}px;display:block;margin:0 auto" role="img" aria-label="${esc(opt.aria||'Velocímetro')}"><defs>${defs}</defs>${body}</svg>`;
}

/* ---------- Vista de velocímetros por proyecto ---------- */
function projSem(s){ // semáforo del proyecto completo
  const e=espOf(s), th=s.th||DEF_TH, gap=(e-s.pct)*100, n=Math.max(1,s.n), late=(s.cnt.rojo||0)/n;
  if(s.pct>=1) return {c:'verde',t:'Ejecutado',why:'100% ejecutado'};
  if(gap>th.rojo) return {c:'rojo',t:'Atrasado',why:Math.round(gap)+'% atrás del plan'};
  if(late>0.10) return {c:'rojo',t:'Atrasado',why:Math.round(late*100)+'% de registros atrasados'};
  if(gap>th.amar) return {c:'amarillo',t:'En riesgo',why:Math.round(gap)+'% atrás del plan'};
  if(e===0&&s.pct===0) return {c:'gris',t:'Sin iniciar',why:s.ini?'inicia el '+fdate(s.ini):'sin fechas'};
  return {c:'verde',t:'Al día',why:gap<=0?'igual o adelante del plan':'dentro de tolerancia'};
}
function espOf(s){ if(!s||!s.ini||!s.plan||!s.plan.length) return 0; const i=dnum(todayISO())-dnum(s.ini); if(i<0) return 0; return s.plan[Math.min(s.plan.length-1,i)]; }
const gapToF=g=>Math.max(0.03,Math.min(0.97,(20-g)/70));
function velGaugeSVG(p,e,th){
  return gaugeHQ(GQ_SEM,gapToF((p-e)*100),{lfs:14,center:pctTxt(p),cfs:40,max:290,aria:'Avance '+pctTxt(p)+', esperado '+pctTxt(e)});
}
function projLineSVG(x,W,H){
  const s=x.sum, c=colorFor(x.id); if(!s||!s.ini||!s.plan.length) return '<p class="empty">Sin fechas para graficar.</p>';
  const t=dnum(todayISO()); let d0=dnum(s.ini), d1=d0+s.plan.length-1; s.real.forEach(([k])=>{ const d=dnum(k); if(d<d0) d0=d; if(d>d1) d1=d; }); if(t>d0&&t<d1+15) d1=Math.max(d1,t);
  const L=34,R=8,Tp=8,B=22, X=d=>L+(d-d0)/Math.max(1,d1-d0)*(W-L-R), Y=v=>Tp+(1-v)*(H-Tp-B);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Plan contra real de ${esc(x.name)}">`;
  [0,.5,1].forEach(v=>{ g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v*100}%</text>`; });
  const step=Math.max(1,Math.ceil((d1-d0)/6)); for(let d=d0; d<=d1; d+=step){ g+=`<text x="${X(d)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${fdate(new Date(d*86400000).toISOString().slice(0,10)).replace(/ \d+$/,'')}</text>`; }
  if(t>=d0&&t<=d1) g+=`<line x1="${X(t)}" x2="${X(t)}" y1="${Tp}" y2="${H-B}" stroke="var(--amarillo)" stroke-width="2"/>`;
  const i0=dnum(s.ini); g+=`<polyline fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="5 4" points="${s.plan.map((v,i)=>X(i0+i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`;
  const rl=s.real.map(([k,v])=>[dnum(k),v]);
  if(rl.length>1) g+=`<polyline fill="none" stroke="${c}" stroke-width="2.6" points="${rl.map(([d,v])=>X(d).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`;
  rl.forEach(([d,v])=>{ g+=`<circle cx="${X(d).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="${c}"><title>${fdate(new Date(d*86400000).toISOString().slice(0,10))}: ${pctTxt(v)}</title></circle>`; });
  return g+'</svg>';
}

/* ---------- Panel "Semáforo" del resumen: velocímetro + barras real/plan ---------- */
function estFin(s){ // fecha estimada de conclusión al ritmo real que lleva el proyecto
  if(!s||!s.meta) return null; if(s.done>=s.meta) return {iso:(s.last||todayISO()).slice(0,10),done:true};
  const t=dnum(todayISO()), i0=s.ini?dnum(s.ini):null; if(i0===null||t<i0) return {iso:s.finV||s.fin,plan:true};
  const rate=s.done/Math.max(1,t-i0+1); if(rate<=0) return null;
  const d=t+Math.ceil((s.meta-s.done)/rate), f=dnum(s.finV||s.fin||todayISO());
  return {iso:new Date(d*86400000).toISOString().slice(0,10),lejos:d>f+365}; // a ese ritmo terminaría más de un año después del plan
}
function projListHTML(sel){ // listado de proyectos con objetivo, avance, fechas y semáforo

function semPanelHTML(sel,pct){
  const S=sel.map(x=>x.sum).filter(s=>s&&!s.missing), M=S.reduce((a,s)=>a+s.meta,0)||1;
  const e=S.reduce((a,s)=>a+espOf(s)*s.meta,0)/M, gap=(pct-e)*100;
  const st=S.map(s=>projSem(s).c), nAl=st.filter(c=>c==='verde').length;
  const zone=gap>=0?['#1E7A3E','Adelante del plan']:gap>=-10?['#3DAA4F','Al día']:gap>=-30?['#E9B10A','Atención']:['#B3261E','Atrasado'];
  // velocímetro: izquierda = mejor; aguja según diferencia contra el plan (+20 a -50 puntos)
  const cx=110, cy=100, R=78, w=22, P2=(f,r)=>{ const a=Math.PI*(1-f); return [cx+r*Math.cos(a),cy-r*Math.sin(a)]; };
  const seg=(f0,f1,col)=>{ const [x1,y1]=P2(f0,R),[x2,y2]=P2(f1,R); return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}"/>`; };
  const lab=(f,t)=>{ const [x,y]=P2(f,R+w/2+8); const ang=-(90-f*180); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="8" fill="var(--muted)" text-anchor="middle" transform="rotate(${ang.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})">${t}</text>`; };
  const g2f=g=>Math.max(0.03,Math.min(0.97,(20-g)/70)), nf=g2f(gap), [nx,ny]=P2(nf,R-14);
  const gauge=`<div style="flex:none;width:300px">${gaugeHQ(GQ_SEM,nf,{aria:'Semáforo: '+zone[1],lfs:14})}</div>`;
  const up=gap>=0, pill=`<span class="sppill ${up?'up':'down'}">${up?'▲':'▼'} ${pctTxt(pct)} / ${pctTxt(e)}</span>`;
  return `<section class="card panel sppanel"><div class="sphead"><h2>${ui._sumAll!==false?'Semáforo global de proyectos TI':(sel.length===1?'Semáforo del proyecto':'Semáforo de los proyectos seleccionados')}</h2>${pill}</div>
    <div class="spg">${gauge}<div class="spbig"><b>${sel.length>1?nAl:''}${sel.length>1?'':zone[1]}</b><span>${sel.length>1?'al día de '+S.length+' proyectos':Math.abs(Math.round(gap))+'% '+(up?'arriba':'abajo')+' del plan'}</span><em style="color:${zone[0]}">${sel.length>1?zone[1]+' en conjunto':''}</em></div></div>
    <div class="spbars" title="Barra verde: avance real. Barra gris: avance que pide el plan a hoy.">
      <div class="spb"><i style="width:${Math.min(100,pct*100)}%;background:linear-gradient(90deg,#1E7A3E,#3DD16B)"></i></div>
      <div class="spb gray"><i style="width:${Math.min(100,e*100)}%"></i><span class="spflag" aria-hidden="true">⚑</span></div>
      <span class="sphoy" style="left:${Math.min(100,e*100)}%"><em>Hoy</em></span>
    </div>

  </section>`;
}

let xlState={}, xlBusy=false; const xlH={};
const canOpenPicker=()=>typeof window.showOpenFilePicker==='function';
function fixMapTT(p,table){ // con la base oficial, los campos se toman siempre de las columnas TT
  const am=autoMap(table.cols); FIELDS.forEach(f=>{ const cur=p.cfg.map[f.k]; const empty=cur&&table.rows.length&&table.rows.filter(r=>r[cur]!==undefined&&String(r[cur]).trim()!=='').length<table.rows.length*0.5;

}
async function workbookFromFile(file){
  const wb=await readFile(file);
  const sheet=wb.SheetNames.find(s=>norm(s)===norm(TT_SHEET))||wb.SheetNames.slice().sort((a,b)=>scoreSheet(wb,b)-scoreSheet(wb,a))[0];
  const table=groupBySite(sheetTable(wb,sheet)); return {wb,sheet,table,info:readInfo(wb)||infoFromTable(table),ck:ttCheck(table,sheet)};
}
function applyTable(p,src,fileName){ // misma lógica que "Actualizar sábana", sin pantallas intermedias
  const prevP=P; P=p; if(!porPct(p)) fixMapTT(p,src.table);
  const b=buildRows(src.table,p.cfg.map,p.rows);
  p.rows=b.rows; p.cols=Array.from(new Set([...(p.cols||[]),...src.table.cols.filter(c=>!c.endsWith(SYS_SUFFIX))]));

}

const D3={done:new Set(),defs:null};
function d3defs(){ if(D3.defs&&document.body.contains(D3.defs)) return D3.defs;

  d.insertAdjacentHTML('beforeend',radial?`<radialGradient id="${id}" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="${d3mix(hex,.65)}"/><stop offset=".45" stop-color="${hex}"/><stop offset="1" stop-color="${d3mix(hex,-.35)}"/></radialGradient>`
    :`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${d3mix(hex,.45)}"/><stop offset=".45" stop-color="${hex}"/><stop offset="1" stop-color="${d3mix(hex,-.28)}"/></linearGradient>`);

    svg.querySelectorAll('rect').forEach(r=>{ const f=r.getAttribute('fill'); const op=parseFloat(r.getAttribute('opacity')||'1'); if(!f||f==='none'||f.startsWith('url')||op<.5) return; const w=+r.getAttribute('width'),h=+r.getAttribute('height'); if(w>240&&h>120) return; const c=d3col(f); if(!c) return; r.setAttribute('fill',`url(#${d3grad(c)})`); r.setAttribute('filter','url(#d3sh)'); });

    const hz=[...svg.querySelectorAll('line')].filter(l=>l.getAttribute('y1')===l.getAttribute('y2')&&+l.getAttribute('x2')-+l.getAttribute('x1')>100).map(l=>+l.getAttribute('y1')), base=hz.length?Math.max(...hz):null;
    svg.querySelectorAll('polyline').forEach(l=>{ l.setAttribute('filter','url(#d3sh)'); const sw=+(l.getAttribute('stroke-width')||1); if(sw<3) l.setAttribute('stroke-width',String(Math.max(sw,2.6)));
      if(base==null||l.dataset.area) return; const pts=(l.getAttribute('points')||'').trim().split(/\s+/).map(p=>p.split(',').map(Number)).filter(p=>p.length===2&&!isNaN(p[0])); if(pts.length<2) return;
      const c=d3col(l.getAttribute('stroke')); if(!c) return; const id='d3a'+c.slice(1)+(l.getAttribute('stroke-dasharray')?'p':'r');
      if(!D3.done.has(id)){ d3defs().insertAdjacentHTML('beforeend',`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity="${l.getAttribute('stroke-dasharray')?'.22':'.38'}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient>`); D3.done.add(id); }
      const a=document.createElementNS('http://www.w3.org/2000/svg','path'); a.setAttribute('d',`M${pts[0][0]} ${base} `+pts.map(p=>`L${p[0]} ${p[1]}`).join(' ')+` L${pts[pts.length-1][0]} ${base} Z`); a.setAttribute('fill',`url(#${id})`); a.setAttribute('pointer-events','none');

let GL=null; // {cfg, cargando, err, tickets, items, filtro, cuando}
// Foco del botón "Estatus GLPI": verde si la última consulta del proyecto salió bien, rojo si falló. Se recuerda en este navegador.
function glpiLuz(){ try{ return JSON.parse(localStorage.getItem('pulsott:glpiluz')||'{}')||{}; }catch(e){ return {}; } }
function glpiLuzSet(ok,cuando){ try{ const m=glpiLuz(); m[P.id]={ok,cuando:cuando.toISOString()}; localStorage.setItem('pulsott:glpiluz',JSON.stringify(m)); }catch(e){} }
function glpiHoy(){ // ¿ya se corrió GLPI hoy? Toma la consulta guardada en el servidor (la ven todos)
  const c=P&&P.glpi&&P.glpi.cuando, l=P&&glpiLuz()[P.id];
  if(l&&!l.ok&&(!c||l.cuando>c)) return {k:'err',at:l.cuando};
  if(!c) return {k:'nunca'};
  return {k:new Date(c).toLocaleDateString('en-CA')===todayISO()?'hoy':'viejo',at:c};
}
function glpiLuzHTML(){ const g=glpiHoy(); if(g.k!=='hoy'&&g.k!=='err') return '';

const GLPI_EST={1:'Nuevo',10:'Aprobación',2:'En curso (asignado)',3:'En curso (planificado)',4:'En espera',5:'Resuelto',6:'Cerrado'};
// ===== Equivalencia GLPI → PULSOTT (tabla acordada el 17-nov-2026). Se usa en "Ver indicadores con: GLPI". =====
// null = NUNCA considerar: el sitio se queda con lo que dice la sábana.
const GLPI_A_PULSOTT={1:null,10:null,2:'Por programar',3:'Programado',4:'Pendiente',5:'Ejecutado',6:'Ejecutado'};
// Por nombre del estado (sin acentos ni mayúsculas): cubre los que GLPI no manda como número, p. ej. "No cerrado" o "Atendiéndose".
const GLPI_NOMBRE_A_PULSOTT={'nuevo':null,'aprobacion':null,'en curso (asignada)':'Por programar','en curso (asignado)':'Por programar',
  'en curso (planificada)':'Programado','en curso (planificado)':'Programado','en espera':'Pendiente','resuelto':'Ejecutado','cerrado':'Ejecutado',
  'resuelto + cerrado':'Ejecutado','no resuelto':'Cancelado','no cerrado':'Cancelado','atendiendose':'Proceso'};
function glpiAPulsott(t){ // estatus de PULSOTT que le toca a un ticket de GLPI (null = no se considera)
  if(!t||!t.existe) return null;
  const n=norm(t.estadoTxt), k=Object.keys(GLPI_NOMBRE_A_PULSOTT).find(x=>norm(x)===n);
  if(n&&k!==undefined) return GLPI_NOMBRE_A_PULSOTT[k];
  return GLPI_A_PULSOTT[t.estado]??null;
}
const GLPI_ORDEN=['Pendiente','Por programar','Programado','Proceso']; // si un sitio tiene folios en distintos estados, manda el menos avanzado
function glpiVista(){ // copia del proyecto con el estatus de cada sitio calculado desde GLPI (no modifica los datos guardados)
  const idx=glpiIndex(), T=glT(), cnt={}; let sinEq=0;
  const eqG=r=>hasEq(r)?r.sys.equipos.map(e=>{ const f=(String(e.folio||'').match(/\b\d{3,9}\b/)||[])[0], g=f&&T[f]&&T[f].existe?glpiAPulsott(T[f]):null; return g?{...e,st:g}:e; }):r.sys.equipos;
  const rows=P.rows.map(r=>{
    if(r.gone||r.sys.estatus==='Cancelado') return r;
    const its=idx.get(r.id)||[], st0=its.map(it=>glpiAPulsott(T[it.folio]));
    if(!its.length||st0.some(x=>!x)){ sinEq++; return r; }
    const st=st0.filter(x=>x!=='Cancelado'); // los folios cancelados no cuentan para el avance del sitio
    if(!st.length){ cnt.Cancelado=(cnt.Cancelado||0)+1; return {...r,sys:{...r.sys,equipos:eqG(r),estatus:'Cancelado',adicionales:0}}; }
    const ej=st.filter(x=>x==='Ejecutado').length, meta=metaOf(r);
    const est=ej===st.length?'Ejecutado':GLPI_ORDEN.find(o=>st.includes(o))||'Pendiente';
    cnt[est]=(cnt[est]||0)+1;
    return {...r,sys:{...r.sys,equipos:eqG(r),estatus:est,avance:est==='Ejecutado'?Math.max(meta,num(r.sys.avance)):Math.round(meta*ej/st.length),adicionales:est==='Ejecutado'?r.sys.adicionales:0}};
  });
  return {p:{...P,rows},cnt,sinEq};
}
// La última consulta se guarda en el proyecto (P.glpi) para que todos vean el sello sin volver a consultar.
const glT=()=>(P&&P.glpi&&P.glpi.tickets)||{};
const glCuando=()=>P&&P.glpi&&P.glpi.cuando?new Date(P.glpi.cuando).toLocaleString('es-MX',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';
function glpiIndex(){ const m=new Map(); glpiFolios().forEach(it=>{ const k=it.r.id; if(!m.has(k)) m.set(k,[]); m.get(k).push(it); }); return m; }
const GL_SELLO={ok:'Coincide',dif:'Diferencia',err:'No encontrado',sin:'Sin folio',pend:'Sin consultar'};
function glpiSitio(r,idx){ // sello de GLPI de un sitio: junta todos sus folios
  const its=(idx||glpiIndex()).get(r.id)||[];
  if(!its.length) return {k:'sin',txt:'Sin folio GLPI',cs:[]};
  if(!P.glpi) return {k:'pend',txt:'GLPI sin consultar',cs:[]};
  const cs=its.map(it=>({it,c:glpiComparar(it)})), has=k=>cs.some(x=>x.c.k===k);
  const k=has('dif')?'dif':has('err')?'err':has('pend')?'pend':'ok';
  const T=glT(), txt=cs.map(({it,c})=>{ const t=T[it.folio]; return '#'+it.folio+' '+(t&&t.existe?(t.estadoTxt||GLPI_EST[t.estado]):'—')+': '+c.txt; }).join(' · ');
  return {k,txt,cs};
}
function glpiAplicable(r,idx){ // GLPI va adelante: todos los tickets del sitio están resueltos o cerrados y el sitio sigue abierto
  if(r.gone||r.sys.estatus==='Ejecutado'||r.sys.estatus==='Cancelado'||!P.glpi) return false;
  const its=(idx||glpiIndex()).get(r.id)||[], T=glT();
  return its.length>0&&its.every(it=>{ const t=T[it.folio]; return t&&t.existe&&t.estado>=5; });
}

    <div id="glcan" class="hidden" style="display:grid;gap:8px;margin-top:8px"><label class="f"><span>Motivo de cancelación <b>*</b></span><select id="glmot"><option value="">Elige…</option>${MOTIVOS.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>
