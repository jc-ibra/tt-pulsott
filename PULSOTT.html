  };
}
function glpiFolios(){ // un renglón por folio GLPI del proyecto, con el estatus que le toca en PULSOTT
  const out=[], seen=new Set();
  P.rows.filter(r=>!r.gone).forEach(r=>{
    let list=hasEq(r)?r.sys.equipos.flatMap(e=>(String(e.folio||'').match(/\b\d{3,9}\b/g)||[]).map(f=>({folio:f,st:e.st,ej:e.ej,desc:eqDesc(e),add:e.add,eq:1})))
      :Array.isArray(r.sys.folios)&&r.sys.folios.length?r.sys.folios.map(f=>({...f})):null;
    if(!list){ const txt=[r.sys.custom&&r.sys.custom.folios_gpli,...Object.keys(r.raw).filter(c=>/^folios? g(pl|lp)i$/.test(norm(c))).map(c=>r.raw[c])].filter(Boolean).join(' ');
      list=(String(txt).match(/\b\d{3,9}\b/g)||[]).map(f=>({folio:f,st:'',ej:0,desc:'',add:false})); }
    list.forEach(f=>{ if(seen.has(f.folio)) return; seen.add(f.folio);
      // el estatus capturado en PULSOTT manda si el sitio ya está ejecutado o cancelado; si no, el de cada equipo
      const site=r.sys.estatus, own=normStatus(f.st);
      const fs=f.eq?(own||site):site==='Ejecutado'||site==='Cancelado'||!own?site:own, det=f.eq?own==='En pausa':/deten|bloq|suspend|pausa/i.test(f.st)||site==='En pausa';
      out.push({folio:+f.folio,r,fs:det&&fs!=='Ejecutado'&&fs!=='Cancelado'?'Detenido':fs,desc:f.desc,add:f.add}); }); });
  return out;
}
function glpiComparar(it){ // ¿el estado del ticket corresponde al estatus del equipo en PULSOTT?
  const t=glT()[it.folio];
  if(!t) return {k:'pend',txt:'Sin consultar'};
  const ga=it.r.sys.glpiAplicado;
  if(ga&&it.r.sys.estatus!==ga.estatus&&t.existe&&t.estado>=5) return {k:'dif',txt:`Se aplicó “${ga.estatus.toLowerCase()}” desde GLPI, pero la sábana ahora dice “${String(it.r.sys.estatus).toLowerCase()}”`};
  if(!t.existe) return {k:'err',txt:t.error||'No existe en GLPI'};
  const e=t.estado, fs=it.fs, cerrado=e>=5, ok={k:'ok',txt:'Coincide'};
  const vivo=({Proceso:'en proceso',Detenido:'detenido',Programado:'programado',Reprogramado:'reprogramado',Pendiente:'pendiente','En pausa':'en pausa'})[fs]||String(fs||'').toLowerCase();
  if(fs==='Ejecutado') return cerrado?ok:{k:'dif',txt:'El equipo está ejecutado, pero el ticket sigue abierto'};
  if(fs==='Cancelado') return cerrado?ok:{k:'dif',txt:'El equipo está cancelado, pero el ticket sigue abierto'};
  if(cerrado) return {k:'dif',txt:`El ticket está ${String(GLPI_EST[e]||'').toLowerCase()}, pero el equipo sigue ${vivo}`};
  if(fs==='Detenido') return e===4?ok:{k:'dif',txt:'El equipo está detenido, pero el ticket no está en espera'};
  if(fs==='Proceso') return e===2||e===3?ok:{k:'dif',txt:e===1?'El equipo está en proceso, pero el ticket sigue como nuevo':'El equipo está en proceso, pero el ticket está en espera'};
  return ok; // programado o pendiente con el ticket abierto
}
async function glpiConsultar(){
  const items=glpiFolios(); GL.items=items; GL.cargando=true; GL.err=''; renderGlpi();
  if(!items.length){ GL.tickets={}; GL.cargando=false; renderGlpi(); return; }
  // por bloques, para mostrar el avance real; solo se guarda si todos los bloques salen bien
  const fol=items.map(x=>x.folio), LOTE=50, tickets={}; GL.prog={hechos:0,total:fol.length};
  try{ for(let i=0;i<fol.length;i+=LOTE){ const d=await api('POST','glpi/'+encodeURIComponent(P.id)+'/consultar',{folios:fol.slice(i,i+LOTE)}); Object.assign(tickets,d.tickets||{}); GL.prog.hechos=Math.min(fol.length,i+LOTE); glpiProg(); }
    GL.cuando=new Date(); P.glpi={cuando:GL.cuando.toISOString(),tickets}; saveProject(P); glpiLuzSet(true,GL.cuando); }
  catch(e){ GL.err=(e.data&&e.data.error)||'No se pudo consultar GLPI.'; glpiLuzSet(false,new Date()); if(e.data&&e.data.glpi==='sin_configurar') GL.cfg=false; }
  GL.cargando=false; GL.prog=null; renderGlpi();
}
/* ---------- GLPI automático: cada 30 min, en segundo plano, para el proyecto abierto ---------- */
const GLA_MIN=30; // cada cuántos minutos se vuelve a consultar GLPI
let GLA={cfg:null,corriendo:null,intento:{}}; // corriendo: {id,hechos,total}; intento: último intento por proyecto
function glAutoHTML(){
  if(!GLA.corriendo||!P||GLA.corriendo.id!==P.id) return '';
  const c=GLA.corriendo, f=c.total?c.hechos/c.total:0, pc=Math.round(f*100);
  return `<span title="Actualizando GLPI en segundo plano: ${fmtN(c.hechos)} de ${fmtN(c.total)} folios. Puedes seguir trabajando.">GLPI</span><span class="glabar" role="progressbar" aria-label="Actualización de GLPI" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pc}"><i style="width:${Math.max(3,pc)}%"></i></span><b>${pc}%</b>`;
}
function glAutoPaint(){ const e=document.getElementById('glauto'); if(e) e.innerHTML=glAutoHTML(); }
async function glpiAuto(forzar){ // forzar = botón "Actualizar GLPI": corre ya, sin esperar los 30 min
  if(!SERVER||!P) return;
  if(forzar&&isRO()){ toast('Tu usuario es de solo consulta: no puede actualizar GLPI.'); return; }
  if(GLA.corriendo){ if(forzar) toast('GLPI ya se está actualizando en segundo plano ('+Math.round(GLA.corriendo.hechos/Math.max(1,GLA.corriendo.total)*100)+'%).'); return; }
  if(isRO()||(GL&&GL.cargando)) return;
  if(!forzar&&(ui.view!=='board'||document.hidden)) return;
  const proj=P, ahora=Date.now(), ult=proj.glpi&&proj.glpi.cuando?Date.parse(proj.glpi.cuando):0;
  if(!forzar&&(ahora-ult<GLA_MIN*60000||ahora-(GLA.intento[proj.id]||0)<GLA_MIN*60000)) return;
  if(GLA.cfg===null||(forzar&&!GLA.cfg)){ try{ GLA.cfg=!!(await api('GET','glpi')).configurado; }catch(e){ GLA.cfg=false; } }
  if(!GLA.cfg){ if(forzar) toast('Falta configurar la conexión con GLPI.'); return; }
  const fol=glpiFolios().map(x=>x.folio); GLA.intento[proj.id]=ahora;
  if(!fol.length){ if(forzar) toast('Este proyecto no tiene folios GLPI que consultar.'); return; }
  if(forzar) toast('Actualizando GLPI en segundo plano. Puedes seguir trabajando.');
  const LOTE=50, tickets={}; GLA.corriendo={id:proj.id,hechos:0,total:fol.length}; glAutoPaint();
  try{
    for(let i=0;i<fol.length;i+=LOTE){
      const d=await api('POST','glpi/'+encodeURIComponent(proj.id)+'/consultar',{folios:fol.slice(i,i+LOTE)});
      Object.assign(tickets,d.tickets||{}); GLA.corriendo.hechos=Math.min(fol.length,i+LOTE); glAutoPaint();
    }
    // se guarda solo si sigue abierto el mismo proyecto (no se toca otro proyecto ni se redibuja la pantalla)
    if(P&&P.id===proj.id){ const cuando=new Date(); P.glpi={cuando:cuando.toISOString(),tickets}; saveProject(P); glpiLuzSet(true,cuando); }
    GLA.corriendo=null; if(forzar) toast('GLPI actualizado: '+fmtN(fol.length)+' folios consultados.');
  }catch(e){ GLA.corriendo=null; if(P&&P.id===proj.id) glpiLuzSet(false,new Date()); if(forzar) toast('No se pudo actualizar GLPI: '+((e.data&&e.data.error)||'sin conexión')+'.'); }
  glAutoPaint();
  // refresca la banda "Validación GLPI" sin interrumpir: solo si estás en el proyecto y sin una captura abierta
  if(P&&P.id===proj.id&&ui.view==='board'&&!ui.open&&typeof renderBoardKeep==='function') renderBoardKeep();
}
setInterval(()=>{ glpiAuto(); },60000); // revisa cada minuto si ya tocan los 30 min

function glpiProgHTML(){ const p=GL&&GL.prog, f=p&&p.total?p.hechos/p.total:0;
  return `<div class="glprog" role="progressbar" aria-label="Avance de la consulta a GLPI" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(f*100)}"><i style="width:${Math.max(2,f*100)}%"></i></div><span class="glpct">${p?`${fmtN(p.hechos)} de ${fmtN(p.total)} folios · <b>${Math.round(f*100)}%</b>`:'Iniciando…'}</span>`; }
function glpiProg(){ // actualiza solo la línea, sin volver a dibujar la tabla

function renderGlpi(){
  if(!GL){ GL={cfg:null,cargando:false,filtro:'all'}; api('GET','glpi').then(d=>{ GL.cfg=!!d.configurado; if(GL.cfg) glpiConsultar(); else renderGlpi(); }).catch(()=>{ GL.cfg=false; renderGlpi(); }); }
  const back=`<button class="btn" id="glback">← Volver al proyecto</button>`;

function fuenteHTML(GV){ // leyenda para quien consulta: de dónde sale el estatus y el avance

    return `<p class="fuente glv">Indicadores según <b>GLPI</b>, consulta del ${esc(glCuando())}: ${parts.join(' · ')||'sin sitios con equivalencia'}${GV.sinEq?` · ${fmtN(GV.sinEq)} sitio${GV.sinEq===1?'':'s'} sin folio o sin equivalencia se toma${GV.sinEq===1?'':'n'} de la sábana`:''}. Es solo una vista: no cambia los datos guardados.</p>`; }

}
function glpiBandHTML(){ // sello de GLPI en el resumen del proyecto

  act.forEach(r=>{ c[glpiSitio(r,idx).k]++; if(glpiAplicable(r,idx)) apl++; });

  }

  $('#back').onclick=()=>{ if(!ar||ui.dvFrom==='home'){ ui.dvFrom=null; go('home'); return; } ui.dvArea=null; try{ history.pushState({v:'desviaciones'},''); }catch(e){} renderDesviaciones(); window.scrollTo(0,0); };

  document.querySelectorAll('[data-dva]').forEach(b=>{ const open=()=>{ ui.dvArea=b.dataset.dva; ui.dvFrom=null; try{ history.pushState({v:'desviaciones',area:ui.dvArea},''); }catch(e){} renderDesviaciones(); window.scrollTo(0,0); }; b.onclick=open; b.onkeydown=ev=>{ if(ev.key==='Enter') open(); }; });
  document.querySelectorAll('[data-dvopen]').forEach(b=>b.onclick=async()=>{ const [pid,rid]=b.dataset.dvopen.split('|'); await openProject(pid); setTimeout(()=>{ if(P&&P.rows.some(r=>r.id===rid)) openDrawer(rid); },350); });
  document.querySelectorAll('[data-dvanular]').forEach(b=>b.onclick=()=>{ const [pid,rid]=b.dataset.dvanular.split('|'); anularDialog(pid,rid,()=>{ DESV=null; renderDesviaciones(); }); });
  document.querySelectorAll('[data-dvhistory]').forEach(panel=>panel.addEventListener('toggle',async()=>{
    if(!panel.open||panel.dataset.loaded) return;
    const card=panel.closest('.dvcard'), content=panel.querySelector('[data-dvhistory-content]');
    panel.dataset.loaded='1';
    content.innerHTML='<p class="muted">Cargando historial…</p>';
    try{
      const items=await api('GET','seguimientos/'+encodeURIComponent(card.dataset.dvsave)+'?fila='+encodeURIComponent(card.dataset.fila));
      if(!panel.isConnected) return;
      content.innerHTML=items.length?`<ol>${items.map(item=>`<li${item.resuelta?' class="dvres"':''}>${item.resuelta?'<span class="dvclosed">✅ Desviación resuelta</span><br>':''}<b>${esc(item.creadoEn)}</b> · <strong>${esc(item.usuario)}</strong><br>${esc(item.comentario).replace(/\n/g,'<br>')}${item.dependencias?`<br><b>Dependencias:</b><br>${esc(item.dependencias).replace(/\n/g,'<br>')}`:''}<br><span class="muted">${item.compromiso?'Compromiso: '+esc(item.compromiso)+' · ':''}GLPI: ${item.tieneGlpi?esc(item.folioGlpi||'—'):'No'}</span></li>`).join('')}</ol>`:'<p class="muted">Aún no hay seguimientos documentados para esta desviación.</p>';
    }catch(e){
      panel.dataset.loaded='';
      content.innerHTML='<p class="formerr" role="alert">No se pudo cargar el historial. Comprueba la conexión e inténtalo de nuevo.</p>';
    }
  }));
  document.querySelectorAll('[data-dvform]').forEach(form=>form.onsubmit=async ev=>{
    ev.preventDefault();
    const f=ev.currentTarget, btns=f.querySelectorAll('button[type="submit"]'), err=f.querySelector('.formerr');
    const resolver=!!(ev.submitter&&ev.submitter.hasAttribute('data-resolver'));
    const d=f.closest('.dvcard');
    const pid=d.dataset.dvsave;
    const fila=d.dataset.fila;
    if(!pid||!fila) return;
    err.textContent='';
    if(resolver&&!f.elements.comentario.value.trim()){ err.textContent='Para cerrarla, escribe en el comentario cómo se resolvió.'; f.elements.comentario.focus(); return; }
    if(resolver&&f.elements.tiene_glpi.value==='true'&&!f.elements.folio_glpi.value.trim()){ err.textContent='Escribe el folio GLPI o cambia "¿Tiene folio GLPI?" a No.'; f.elements.folio_glpi.focus(); return; }
    if(resolver&&!confirm('¿Marcar la desviación de '+fila+' como resuelta?\n\nNo se borra: queda en el historial con tu nombre y la fecha de hoy.')) return;
    btns.forEach(b=>b.disabled=true);
    try{
      const res=await api('POST','seguimientos/'+encodeURIComponent(pid),{
        fila,
        area:ar,
        comentario:f.elements.comentario.value.trim(),
        dependencias:f.elements.dependencias.value.trim(),
        compromiso:f.elements.compromiso.value,
        tieneGlpi:f.elements.tiene_glpi.value==='true',
        folioGlpi:f.elements.folio_glpi.value.trim(),
        resuelta:resolver
      });
      // si ese proyecto está abierto, se vuelve a leer para no pisar el cierre al guardar después
      if(res&&res.resuelta&&P&&P.id===pid){ try{ const pd=await api('GET','proyectos/'+encodeURIComponent(pid)); if(P&&P.id===pid&&!P.dirty){ const keepCorte=P.corte; srvVer[pid]=pd.version; P=pd.data; P.corte=keepCorte; P.dirty=false; P.cfg.th=Object.assign({},DEF_TH,P.cfg.th); sset(PK(pid),P); } }catch(_){} }
      toast(resolver?'Desviación de '+fila+' marcada como resuelta.':'Seguimiento guardado en la ficha técnica.');
      DESV=null;
      renderDesviaciones();
    }catch(e){
      err.textContent=(e.data&&e.data.error)||'No se pudo guardar. Intenta de nuevo.';
      btns.forEach(b=>b.disabled=false);
    }
  });
}

async function linkFile(){ if(!canFS()) return; const h=await idbGet('archivo-sistema'); if(h){ fileHandle=h; autoState=(await ensurePerm(h,false))?'ok':'perm'; if(autoState==='ok'&&P.dirty) autoSave(); updateSaveBar(); } }
async function openProject(id){ if(SERVER) return srvOpen(id); const p=await dget(PK(id)); if(!p){ toast('No encontré ese proyecto.'); return; } if((migrateCase(p)|ensureFolios(p))&&!isRO()) setTimeout(()=>saveProject(P),0); P=p; P.cfg.th=Object.assign({},DEF_TH,P.cfg.th); ui={sema:null,grupo:null,resp:null,q:'',sort:{k:'sema',dir:1},open:null}; fileHandle=null; autoState=''; go('board'); linkFile(); if(P.linked) setTimeout(()=>syncLinked(false),400); }

function bindDrop(mode){
  const d=$('#drop'), f=$('#file');
  const pick=()=>{ f.value=''; f.onchange=()=>f.files[0]&&loadFile(f.files[0],mode); f.click(); };
  if(d){ d.onclick=pick; d.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); pick(); } };
    d.ondragover=e=>{ e.preventDefault(); d.classList.add('over'); }; d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=e=>{ e.preventDefault(); d.classList.remove('over'); const fl=e.dataTransfer.files[0]; if(fl) loadFile(fl,mode); }; }
  return pick;
}
async function loadFile(file,mode){
  if(isRO()){ toast('Modo consulta: no se pueden subir sábanas.'); return; }
  try{
    toast('Leyendo '+file.name+'…');
    const wb=await readFile(file);
    const sheet=wb.SheetNames.find(s=>norm(s)===norm(TT_SHEET))||wb.SheetNames.slice().sort((a,b)=>scoreSheet(wb,b)-scoreSheet(wb,a))[0];
    const table=groupBySite(sheetTable(wb,sheet));
    if(table.grouped) setTimeout(()=>toast('Sábana desglosada: '+table.grouped.from+' filas agrupadas en '+table.grouped.to+' sitios por CR O ID.'),1800);
    pending={wb,sheet,table,fileName:file.name,mode,proj:mode==='update'?P:null,tipo:mode==='update'?tipoOf(P):(tipoDeLibro(wb)||nuevoTipo||'rollout'),_nt:(nuevoTipo=null),info:readInfo(wb)||infoFromTable(table)};
    if(mode==='update'){
      // si las columnas mapeadas siguen existiendo, se actualiza directo
      const missing=FIELDS.filter(f=>f.req&&P.cfg.map[f.k]&&!table.cols.includes(P.cfg.map[f.k]));
      const ck=porPct(P)?{crit:[],miss:[],bad:0,noId:0,noDate:0,sheetOk:true}:ttCheck(table,sheet);
      if(!ck.crit.length){ if(!porPct(P)) fixMapTT(P,table); missing.length=0; FIELDS.forEach(f=>{ if(f.req&&P.cfg.map[f.k]&&!table.cols.includes(P.cfg.map[f.k])) missing.push(f); }); }
      if(!missing.length&&!ck.crit.length&&ck.sheetOk&&(pending.info||P.info||porPct(P))){
        if(!porPct(P)&&(!pending.info||pending.info.derived)) setTimeout(()=>toast('El Excel no trae la hoja '+INFO_SHEET+(pending.info?'; el cliente y el CC se tomaron de las columnas PROYECTO y CENTRO DE COSTOS':'')+'. Se conservan la versión y la fecha anteriores.'),2500);
        pending.map=Object.assign({},P.cfg.map);
        pending.extras=defaultExtras(table,pending.map,P.cfg.custom);
        pending.custom=P.cfg.custom.slice();
        applyUpdate();
        if(ck.bad||ck.noId||ck.noDate||ck.miss.length) setTimeout(()=>toast('Base cargada con observaciones: '+[ck.miss.length?ck.miss.length+' columnas faltantes':'',ck.bad?ck.bad+' estatus no válidos':'',ck.noId?ck.noId+' filas sin CR O ID':'',ck.noDate?ck.noDate+' filas sin fechas':''].filter(Boolean).join(', ')+'.'),4000);
        return;
      }
      toast('Cambiaron algunas columnas. Revisa los campos.');
    }
    pending.map = mode==='update' ? Object.assign({},P.cfg.map) : autoMap(table.cols);
    if(mode==='update') FIELDS.forEach(f=>{ if(pending.map[f.k]&&!table.cols.includes(pending.map[f.k])) pending.map[f.k]=null; });
    pending.custom = mode==='update' ? P.cfg.custom.slice() : [{...FOLIOS_COL}];
    pending.extras = defaultExtras(table,pending.map,pending.custom);
    pending.name = mode==='update' ? P.name : file.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ');
    go('setup');
  }catch(e){ toast(e.message||'No pude leer ese archivo.'); }
}
function defaultExtras(table,map,custom=[]){
  const used=new Set(Object.values(map).filter(Boolean));
  const customLabels=new Set(custom.map(c=>ttKey(c.label)));
  return table.cols.filter(c=>!used.has(c)&&!c.endsWith(SYS_SUFFIX)&&!customLabels.has(ttKey(c))&&!hiddenExcelColumn(c));
}
function applyUpdate(){
  P.cfg.extras=pending.extras;
  P.cfg.custom=pending.custom;
  const b=buildRows(pending.table,P.cfg.map,P.rows);
  P.rows=b.rows; P.cols=Array.from(new Set([...(P.cols||[]),...pending.table.cols.filter(c=>!c.endsWith(SYS_SUFFIX))]));
  P.source={file:pending.fileName,sheet:pending.sheet,at:new Date().toISOString()};
  const oldV=infoVal(P.info,/^version/); if(pending.info){ P.info=mergeInfo(P.info,pending.info); const cl=infoVal(P.info,/^cliente/); if(cl) boOf(P).ficha.cliente=String(cl); }
  const newV=infoVal(P.info,/^version/); if(oldV!==''&&newV!==''&&String(oldV)!==String(newV)) setTimeout(()=>toast('Versión del Excel: '+oldV+' → '+newV+'.'),3600);
  saveProject(P); pending=null; go('board');
  toast('Sábana actualizada: '+b.rows.length+' registros'+(b.kept?', '+b.kept+' ya no venían en el archivo y se conservaron':'')+'.');
}

function fotoReducir(file){ // recorta al centro y reduce a 160 px (JPEG) para que pese poco

    im.onload=()=>{ const s=Math.min(im.width,im.height), c=document.createElement('canvas'); c.width=c.height=160;
      c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg',.85)); };
    im.onerror=()=>{ URL.revokeObjectURL(url); bad(new Error('img')); }; im.src=url; }); }

  const act=rows.filter(x=>x.s.c!=='negro'), cnt={verde:0,amarillo:0,rojo:0,negro:0,gris:0}; rows.forEach(x=>cnt[x.s.c]++);
  const meta=act.reduce((a,x)=>a+x.m,0), done=act.reduce((a,x)=>a+x.hecho,0);
  const agrupa=key=>{ const g={}; rows.forEach(x=>{ const v=x[key]; const y=g[v]=g[v]||{k:v,n:0,meta:0,done:0,rojo:0,amarillo:0,concl:0,canc:0};
      y.n++; if(x.s.c==='negro'){ y.canc++; return; } y.meta+=x.m; y.done+=x.hecho; if(x.s.c==='rojo') y.rojo++; if(x.s.c==='amarillo') y.amarillo++; if(x.s.done) y.concl++; });
    return Object.values(g).map(y=>({...y,falta:Math.max(0,y.meta-y.done),pct:y.meta?y.done/y.meta:0})).sort((a,b)=>b.meta-a.meta||a.k.localeCompare(b.k)); };
  // totales por la columna ESTATUS OPERATIVO (Pendiente, Programado, Proceso, Ejecutado, Cancelado...)
  const EO=['Ejecutado','Proceso','Programado','Reprogramado','Por programar','Pendiente','En pausa','Cancelado'], pe={};
  rows.forEach(x=>{ const v=x.r.sys.estatus||'Sin estatus'; const y=pe[v]=pe[v]||{k:v,n:0,meta:0,done:0}; y.n++; y.meta+=x.m; y.done+=x.hecho; });
  const porEst=Object.values(pe).sort((a,b)=>{ const o=k=>{ const i=EO.indexOf(k); return i<0?99:i; }; return o(a.k)-o(b.k)||a.k.localeCompare(b.k); });
  const pl={}; rows.forEach(x=>Object.entries(eqEst(x.r)).forEach(([k,n])=>{ const y=pl[k]=pl[k]||{k,n:0,meta:0}; y.meta+=n; y.n++; }));

}

// Gráficas de la hoja del coordinador (se dibujan después de pintar la hoja, para conocer el ancho)
function coordCharts(D){
  const u=P.cfg.map.meta?String(P.cfg.map.meta).toLowerCase():'registros', sit=n=>n===1?'sitio':'sitios';
  // 1) dona de sitios por semáforo
  const SC={verde:SCOL.verde,amarillo:SCOL.amarillo,rojo:SCOL.rojo,gris:SCOL.gris,negro:SCOL.negro};
  const parts=['verde','amarillo','rojo','gris','negro'].map(c=>({l:COSEM[c],v:D.cnt[c],c:SC[c]}));
  const n=D.rows.length;
  $('#co-don').innerHTML=donutSVG(parts,fmtN(n),sit(n))+`<div class="xleg">${parts.filter(p=>p.v).map(p=>`<span><i style="background:${p.c}"></i><span class="xlt"><b>${fmtN(p.v)} ${sit(p.v)}</b> ${esc(p.l.toLowerCase())}</span><em>${n?pctTxt(p.v/n):''}</em></span>`).join('')}</div>`;
  // 2) equipos por estado: sombra = objetivo, verde = ejecutado
  const G=D.porEdo.filter(g=>g.meta), mx=Math.max(1,...G.map(g=>g.meta));
  $('#co-edo').innerHTML=G.length?`<div class="xh">${G.map(g=>`<div class="xhr" title="${esc(coCap(g.k))}: ${fmtN(g.done)} de ${fmtN(g.meta)} ${esc(u)} (${pctTxt(g.pct)})"><span class="xhl">${esc(coCap(g.k))}</span><span class="xht"><i style="width:${g.meta/mx*100}%;background:var(--line)"></i><i style="position:absolute;left:0;top:3px;bottom:3px;width:${g.done/mx*100}%;background:var(--verde);border-radius:4px"></i></span><b>${fmtN(g.done)}/${fmtN(g.meta)}</b></div>`).join('')}</div><div class="legend"><span><i style="background:var(--line)"></i>Objetivo</span><span><i style="background:var(--verde)"></i>Ejecutado</span></div>`:'<p class="empty">Sin datos.</p>';
  // 3) avance acumulado en equipos: plan (fecha compromiso original) contra real (fecha de cierre)
  const act=D.rows.filter(x=>x.s.c!=='negro'), plan={}, real={};
  act.forEach(x=>{ const f=datesOrig(x.r).fin; if(f){ const w=lunes(f); plan[w]=(plan[w]||0)+x.m; } if(x.s.done){ const d=x.r.sys.cierre||datesVig(x.r).fin; if(d){ const w=lunes(d); real[w]=(real[w]||0)+x.m; } } });
  const ks=[...new Set([...Object.keys(plan),...Object.keys(real)])].sort(), el=$('#co-line');
  if(!ks.length) el.innerHTML='<p class="empty">Sin fechas.</p>'; else {
    const W=Math.max(300,el.clientWidth||600),H=200,Lm=40,Rm=10,Tp=10,B=26, cw=lunes(corte());
    let ap=0,ar=0; const ptsP=[],ptsR=[]; ks.forEach(k=>{ ap+=plan[k]||0; ar+=real[k]||0; ptsP.push(ap); ptsR.push(k<=cw?ar:null); });
    const mx2=Math.max(1,D.meta,...ptsP), X=i=>Lm+(ks.length===1?(W-Lm-Rm)/2:i*(W-Lm-Rm)/(ks.length-1)), Y=v=>Tp+(1-v/mx2)*(H-Tp-B);
    let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Avance acumulado plan contra real">`;
    [0,.5,1].forEach(f=>{ s+=`<line x1="${Lm}" x2="${W-Rm}" y1="${Y(mx2*f)}" y2="${Y(mx2*f)}" stroke="var(--line)"/><text x="${Lm-5}" y="${Y(mx2*f)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtN(Math.round(mx2*f))}</text>`; });
    const ci=ks.findIndex(k=>k>=cw); if(ci>=0) s+=`<line x1="${X(ci)}" x2="${X(ci)}" y1="${Tp}" y2="${H-B}" stroke="var(--amarillo)" stroke-dasharray="4 3"/>`;
    s+=`<polyline fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" points="${ptsP.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
    const rr=ptsR.map((v,i)=>v===null?null:X(i)+','+Y(v)).filter(Boolean); if(rr.length) s+=`<polyline fill="none" stroke="var(--verde)" stroke-width="3" points="${rr.join(' ')}"/>`;
    ks.forEach((k,i)=>{ s+=`<circle cx="${X(i)}" cy="${Y(ptsP[i])}" r="6" fill="transparent"><title>Semana del ${fdate(k)}: plan ${fmtN(ptsP[i])}${ptsR[i]!==null?' · real '+fmtN(ptsR[i]):''} ${esc(u)}</title></circle>`;
      if(ks.length<=14||i%2===0) s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${fdate(k).replace(/ \d+$/,'')}</text>`; });
    el.innerHTML=s+`</svg><div class="legend"><span><i style="background:var(--muted)"></i>Plan (acumulado)</span><span><i style="background:var(--verde);height:4px"></i>Real (acumulado)</span><span><i style="background:var(--amarillo)"></i>Fecha de corte</span></div>`;
  }
  // 4) sitios programados contra concluidos por semana
  const wk={}; act.forEach(x=>{ const f=datesOrig(x.r).fin; if(f){ const w=lunes(f); wk[w]=wk[w]||{p:0,c:0}; wk[w].p++; } if(x.s.done){ const d=x.r.sys.cierre||datesVig(x.r).fin; if(d){ const w=lunes(d); wk[w]=wk[w]||{p:0,c:0}; wk[w].c++; } } });
  const ws=Object.keys(wk).sort(), el2=$('#co-sem');
  if(!ws.length) el2.innerHTML='<p class="empty">Sin fechas.</p>'; else {
    const W=Math.max(300,el2.clientWidth||600),H=200,Lm=30,Rm=8,Tp=10,B=26,mx=Math.max(1,...ws.map(k=>Math.max(wk[k].p,wk[k].c))), gw=(W-Lm-Rm)/ws.length, bw=Math.min(18,gw*.32), Y=v=>Tp+(1-v/mx)*(H-Tp-B), cw=lunes(corte());
    let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sitios programados contra concluidos por semana">`;
    [0,.5,1].forEach(f=>{ s+=`<line x1="${Lm}" x2="${W-Rm}" y1="${Y(mx*f)}" y2="${Y(mx*f)}" stroke="var(--line)"/><text x="${Lm-5}" y="${Y(mx*f)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(mx*f)}</text>`; });
    ws.forEach((k,i)=>{ const x=Lm+gw*i+gw/2, v=wk[k];
      if(k===cw) s+=`<rect x="${Lm+gw*i}" y="${Tp}" width="${gw}" height="${H-Tp-B}" fill="var(--amarillo)" opacity=".12"/>`;
      s+=`<rect x="${x-bw-1}" y="${Y(v.p)}" width="${bw}" height="${Y(0)-Y(v.p)}" rx="2" fill="var(--gris)"><title>Semana del ${fdate(k)}: ${v.p} ${sit(v.p)} programados</title></rect><rect x="${x+1}" y="${Y(v.c)}" width="${bw}" height="${Y(0)-Y(v.c)}" rx="2" fill="var(--verde)"><title>Semana del ${fdate(k)}: ${v.c} ${sit(v.c)} concluidos</title></rect>`;
      if(ws.length<=14||i%2===0) s+=`<text x="${x}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${fdate(k).replace(/ \d+$/,'')}</text>`; });
    el2.innerHTML=s+'</svg><div class="legend"><span><i style="background:var(--gris)"></i>Programados</span><span><i style="background:var(--verde)"></i>Concluidos</span><span><i style="background:var(--amarillo);opacity:.5"></i>Semana actual</span></div>';
  }
}

  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Avance acumulado plan contra real">`;
  [0,.25,.5,.75,1].forEach(v=>{ s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v*100}%</text>`; });
  const step=Math.max(1,Math.ceil((d1-d0)/7));
  for(let d=d0; d<=d1; d+=step){ const iso=new Date(d*86400000).toISOString().slice(0,10); s+=`<text x="${x(d)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${fdate(iso).replace(/ \d+$/,'')}</text>`; }
  s+=`<polyline fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4" points="${plan.map(([d,v])=>x(d).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`;
  const c=dnum(corte()); if(c>=d0&&c<=d1) s+=`<line x1="${x(c)}" x2="${x(c)}" y1="${Tp}" y2="${H-B}" stroke="var(--amarillo)" stroke-width="2"/>`;
  const rh=hist.filter(([d])=>d<=d1);
  if(rh.length>1) s+=`<polyline fill="none" stroke="var(--verde)" stroke-width="3" points="${rh.map(([d,v])=>x(d).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>`;
  rh.forEach(([d,v])=>{ s+=`<circle cx="${x(d)}" cy="${y(v)}" r="4" fill="var(--verde)"><title>${fdate(new Date(d*86400000).toISOString().slice(0,10))}: ${pctTxt(v)}</title></circle>`; });
  el.innerHTML=s+'</svg>';
}

    { const PR=boPrecio(b,BT.pres); sh([['Descripción','Costo unitario','Unidad','Cantidad','Importe','Gastado','Disponible']].concat(b.pres.map(x=>{ const g=gastRubro(b,x), m=impRubro(x); return [x.rubro,'cu' in x?num(x.cu):num(x.monto),x.unidad||'','cant' in x?num(x.cant):(num(x.monto)?1:0),m,g,m-g]; }),[['Total costo directo','','','',BT.pres,BT.gast,BT.disp],[],['Cálculo del precio final','Tipo','Valor','','Importe'],['Costo directo','','','',PR.costo]],PR.c.flatMap(x=>(x.k==='adm'?[['Subtotal (costo directo + bono)','','','',PR.sub]]:[]).concat([[x.l,x.t==='%'?'Porcentaje':'Monto fijo',x.v,'',x.imp]])),[['PU no comisionable','','','',PR.sinComision],['Precio mínimo','','','',PR.minimo],['Precio final','','','',PR.final]]),'BO Presupuesto',[30,14,10,10,14,14,14]); }
    sh([['Semana (lunes)','Fecha','Rubro','Concepto','Monto','Responsable','Comprobante','Notas']].concat(b.gastos.slice().sort((a,c)=>(a.fecha||'').localeCompare(c.fecha||'')).map(g=>[d(lunes(g.fecha)),d(g.fecha),g.rubro,g.concepto,num(g.monto),g.resp||'',g.comp||'',g.notas||''])),'BO Gastos',[14,12,16,36,12,18,12,30]);
    sh([['Nombre','Rol','Desde','Hasta','Costo por día','Días trabajados','Costo']].concat(b.rh.map(r=>[r.nombre,r.rol,d(r.ini),d(r.fin),num(r.costoDia),num(r.dias),num(r.costoDia)*num(r.dias)])),'BO Personal',[28,16,12,12,14,14,14]);
    sh([['Herramienta o equipo','Cantidad','Asignado a','Tipo','Estado','Costo']].concat(b.herr.map(r=>[r.herr,num(r.cant),r.asig||'',r.tipo||'',r.estado||'',num(r.costo)])),'BO Herramientas',[30,10,22,10,12,12]);
    sh([['Material','Unidad','Planeado','Usado','Diferencia','Costo unitario','Costo usado']].concat(b.mat.map(r=>[r.mat,r.unidad||'',num(r.plan),num(r.usado),num(r.plan)-num(r.usado),num(r.cu),num(r.usado)*num(r.cu)])),'BO Materiales',[30,10,10,10,10,14,14]);
  }
  const safe=P.name.replace(/[^\wáéíóúñÁÉÍÓÚÑ ]+/g,'').trim().replace(/\s+/g,'_').slice(0,40)||'Proyecto';
  await deliver('PULSOTT - '+safe.replace(/_/g,' ')+' - corte '+corte()+'.xlsx',XLSX.write(wb,{bookType:'xlsx',type:'array',cellDates:true}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

/* ---------- Inicio ---------- */
function programHTML(proj){
  const json=JSON.stringify(proj).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return TEMPLATE.replace(/(<script id="proyecto-data" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+json+b);
}
/* ---------- Modo programa: base de datos local (servidor.py) ---------- */
let SERVER=false, srvVer={}, srvTimer=null, srvState='', srvAt=null, SESION=null;
async function api(method,path,body){
  const h={'Content-Type':'application/json'}; if(SESION&&SESION.csrf) h['X-CSRF-Token']=SESION.csrf;
  const r=await fetch('api/'+path,{method,cache:'no-store',credentials:'same-origin',headers:h,body:body?JSON.stringify(body):undefined});
  let d=null; try{ d=await r.json(); }catch(_){}
  if((r.status===401||r.status===403)&&d&&d.login){ location.href=d.login; } // sesión vencida o contraseña pendiente
  if(r.status===403&&d&&d.error&&!d.login) toast(d.error);
  if(!r.ok){ const e=new Error('HTTP '+r.status); e.status=r.status; e.data=d; throw e; }
  return d;
}
async function detectServer(){ if(!/^https?:$/.test(location.protocol)) return false; try{ const c=new AbortController(); setTimeout(()=>c.abort(),1500); const r=await fetch('api/ping',{cache:'no-store',signal:c.signal}); if(!r.ok) return false; const d=await r.json(); return !!(d&&d.tablero); }catch(e){ return false; } }
async function refreshList(){ if(!SERVER) return; try{ const old=listProjects(), nw=await api('GET','proyectos'); sset(IDX,nw.map(x=>{ const o=old.find(y=>y.id===x.id); return o&&o.updated===x.updated?{...x,sum:o.sum,color:o.color}:{...x,color:o&&o.color}; })); }catch(e){ toast('No hay conexión con la base de datos.'); } }
const lastAct=r=>{ let a=''; (r.sys.log||[]).forEach(l=>{ if(l.at>a) a=l.at; }); (r.sys.reprog||[]).forEach(l=>{ if(l.at>a) a=l.at; }); return a; };
function mergeProj(mine,theirs){ // une cambios de dos personas sin perder historial
  const out=JSON.parse(JSON.stringify(theirs)), byId={}; out.rows.forEach(r=>byId[r.id]=r);
  const uni=(a,b)=>{ const m=new Map(); [...(a||[]),...(b||[])].forEach(x=>{ const o=m.get(x.at); m.set(x.at,o&&o.anulada&&!x.anulada?{...x,anulada:true}:x); }); return [...m.values()].sort((x,y)=>x.at.localeCompare(y.at)); };
  mine.rows.forEach(r=>{ const t=byId[r.id]; if(!t){ out.rows.push(JSON.parse(JSON.stringify(r))); return; }
    const log=uni(t.sys.log,r.sys.log), rep=uni(t.sys.reprog,r.sys.reprog);
    if(lastAct(r)>lastAct(t)) t.sys=JSON.parse(JSON.stringify(r.sys));
    t.sys.log=log; t.sys.reprog=rep; });
  out.cfg=mine.cfg; out.name=mine.name; out.cols=mine.cols; out.corte=mine.corte; out.hist=Object.assign({},theirs.hist,mine.hist);
  if(mine.glpi&&(!theirs.glpi||mine.glpi.cuando>theirs.glpi.cuando)) out.glpi=mine.glpi;
  return out;
}
function srvQueue(){ if(!SERVER||!P) return; srvState='pending'; updateSaveBar(); clearTimeout(srvTimer); srvTimer=setTimeout(srvPush,500); }
async function srvPush(retry){
  if(!SERVER||!P) return; clearTimeout(srvTimer);
  const id=P.id; P.dirty=false;
  try{ const d=await api('PUT','proyectos/'+encodeURIComponent(id),{data:P,base:srvVer[id]||0}); srvVer[id]=d.version; srvState='ok'; srvAt=new Date().toISOString(); sset(PK(id),P); }
  catch(e){
    if(e.status===409&&e.data&&e.data.data&&!retry){ P=mergeProj(P,e.data.data); srvVer[id]=e.data.version; sset(PK(id),P); await srvPush(true); renderBoardKeep(); toast('Se juntaron tus cambios con los de otra persona.'); return; }
    srvState='err'; P.dirty=true;
  }
  updateSaveBar();
}
async function srvOpen(id){
  try{ const d=await api('GET','proyectos/'+encodeURIComponent(id)); srvVer[id]=d.version; P=d.data; P.dirty=false; if((migrateCase(P)|ensureFolios(P))&&!isRO()) setTimeout(()=>saveProject(P),0); P.cfg.th=Object.assign({},DEF_TH,P.cfg.th); sset(PK(id),P);
    ui={sema:null,grupo:null,resp:null,q:'',sort:{k:'sema',dir:1},open:null}; srvState='ok'; srvAt=P.updated; go('board'); }
  catch(e){ toast('No pude abrir el proyecto de la base de datos.'); }
}
setInterval(async()=>{ // si otra persona capturó, se actualiza la pantalla
  if(!SERVER||!P||ui.view!=='board'||ui.open||srvState==='pending'||document.querySelector('.colpop')) return;
  try{ const d=await api('GET','proyectos/'+encodeURIComponent(P.id)+'/version'); if(d.version>(srvVer[P.id]||0)){ const f=await api('GET','proyectos/'+encodeURIComponent(P.id)); srvVer[P.id]=f.version; const keepCorte=P.corte; P=f.data; P.corte=keepCorte; P.dirty=false; P.cfg.th=Object.assign({},DEF_TH,P.cfg.th); sset(PK(P.id),P); renderBoardKeep(); toast('Se actualizaron datos capturados por otra persona.'); } }catch(e){}
},20000);

/* ---------- Guardar en el mismo archivo (como un sistema) ---------- */
const canFS=()=>!SERVER&&typeof window.showSaveFilePicker==='function';
let fileHandle=null, autoTimer=null, autoState='';
function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('tablero-archivos',1); r.onupgradeneeded=()=>r.result.createObjectStore('h'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
async function idbGet(k){ try{ const db=await idb(); return await new Promise(res=>{ const q=db.transaction('h').objectStore('h').get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const db=await idb(); await new Promise(res=>{ const tx=db.transaction('h','readwrite'); tx.objectStore('h').put(v,k); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }
const safeName=()=>'PULSOTT.html';
async function ensurePerm(h,ask){ try{ const o={mode:'readwrite'}; if(await h.queryPermission(o)==='granted') return true; if(ask&&await h.requestPermission(o)==='granted') return true; }catch(e){} return false; }
async function writeFile(h){ const data=await bundle(); const w=await h.createWritable(); await w.write(programHTML(data)); await w.close(); }
async function saveHTML(saveAs){
  if(isRO()){ toast('Modo consulta: no se pueden guardar cambios.'); return; }
  if(SERVER&&!saveAs){ await srvPush(); toast(srvState==='ok'?'Guardado en la base de datos.':'No se pudo guardar; se reintentará.'); return; }
  if(canFS()){
    try{
      let h=saveAs?null:(fileHandle||await idbGet('archivo-sistema'));
      if(h&&!(await ensurePerm(h,true))) h=null;
      if(!h) h=await window.showSaveFilePicker({suggestedName:safeName(),types:[{description:'Pulso y Seguimiento Operativo Trantor Technologies (PULSOTT)',accept:{'text/html':['.html']}}]});
      P.savedAt=new Date().toISOString(); P.dirty=false; P.fileName=h.name;
      await writeFile(h); fileHandle=h; await idbSet('archivo-sistema',h); sset(PK(P.id),P);
      autoState='ok'; renderBoardKeep(); toast('Guardado en '+h.name+'. A partir de ahora se guarda solo.'); return;
    }catch(e){
      if(e&&e.name==='AbortError'){ toast('No se guardó.'); return; }
      // el navegador no permite escribir el archivo aquí: se descarga una copia
    }
  }
  P.savedAt=new Date().toISOString(); P.dirty=false;
  sset(PK(P.id),P);
  await deliver(safeName(),programHTML(await bundle()),'text/html');
  renderBoardKeep();
}
function autoSave(){ // tras cada cambio, si ya hay archivo elegido y con permiso, se escribe solo
  if(!fileHandle) return;
  clearTimeout(autoTimer); autoState='pending';
  autoTimer=setTimeout(async()=>{
    if(!(await ensurePerm(fileHandle,false))){ autoState='perm'; updateSaveBar(); return; }
    try{ P.savedAt=new Date().toISOString(); P.dirty=false; await writeFile(fileHandle); sset(PK(P.id),P); autoState='ok'; }catch(e){ autoState='err'; P.dirty=true; }
    updateSaveBar();
  },1200);
}
function renderBoardKeep(){ if(ui.view!=='board') return; const y=window.scrollY; const o=ui.open; ui.open=null; renderBoard(); ui.open=o; window.scrollTo(0,y); }
function saveBarHTML(){
  if(SERVER){
    if(srvState==='err') return {cls:'',html:'<span><b>No se pudo guardar en la base de datos.</b> Revisa que el programa siga abierto. Tus cambios están en pantalla y se reintentan al tocar Guardar.</span><button class="btn small primary" data-save>Guardar</button>'};
    if(srvState==='pending') return {cls:'ok mini',html:'<span>Guardando…</span>'};
    return {cls:'ok mini',html:'<span title="Conectado a la base de datos. Cada cambio se guarda solo y todos los que usen el sistema ven lo mismo.">Guardado'+(srvAt?' · '+esc(fdatetime(srvAt)):'')+'</span>'};
  }
  const t=P.savedAt?fdatetime(P.savedAt):'';
  if(fileHandle&&autoState==='perm') return {cls:'',html:'<span><b>Guardado automático en pausa.</b> El navegador pide permiso otra vez para escribir en '+esc(fileHandle.name)+'.</span><button class="btn small primary" data-save>Dar permiso y guardar</button>'};
  if(fileHandle&&autoState==='err') return {cls:'',html:'<span><b>No se pudo guardar en el archivo.</b> Revisa que no esté abierto en otro programa.</span><button class="btn small primary" data-save>Intentar de nuevo</button>'};
  if(fileHandle&&(autoState==='pending'||P.dirty)) return {cls:'ok',html:'<span><b>Guardando en '+esc(fileHandle.name)+'…</b></span>'};
  if(fileHandle) return {cls:'ok',html:'<span><b>Guardado automático activo</b> en '+esc(fileHandle.name)+(t?'. Último guardado: '+esc(t):'.')+' Cada cambio se guarda solo en el archivo.</span><button class="btn small" data-saveas>Guardar como…</button>'};
  if(P.dirty) return {cls:'',html:'<span><b>Tienes cambios sin guardar en el archivo.</b> '+(canFS()?'Toca “Guardar” y elige este mismo archivo: desde ahí se guarda solo, como un sistema.':'Toca “Guardar” para bajar la versión nueva.')+'</span><button class="btn small primary" data-save>Guardar</button>'};
  return {cls:'ok',html:'<span><b>El archivo está al día.</b>'+(t?' Guardado el '+esc(t):'')+' Captura aquí o sube una sábana con las mismas columnas.</span>'};
}
function updateSaveBar(){ const el=document.querySelector('.savebar'); if(!el) return; const s=saveBarHTML(); el.className='card savebar '+s.cls; el.innerHTML=s.html; bindSaveBtns(el); }
function bindSaveBtns(root){ (root||document).querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveHTML(false)); (root||document).querySelectorAll('[data-saveas]').forEach(b=>b.onclick=()=>saveHTML(true)); }
document.addEventListener('keydown',e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&ui.view==='board'&&P){ e.preventDefault(); saveHTML(false); } });
(async function init(){
  { let e0=null; try{ e0=JSON.parse(document.getElementById('proyecto-data').textContent||'null'); }catch(e){} await initRole(e0); }
  SERVER=await detectServer();
  if(SERVER){
    // El rol lo decide el servidor según el usuario que inició sesión
    try{ SESION=await api('GET','sesion'); AUTH=null; ROLE=SESION.puedeEditar?'operator':'viewer'; applyRole(); }catch(e){ return; }
    document.body.classList.add('srv'); loadFotos();
    let list=[]; try{ list=await api('GET','proyectos'); }catch(e){}
    try{ const emb=JSON.parse(document.getElementById('proyecto-data').textContent||'null');
      const embs=emb?(emb.multi?emb.projects:(emb.id?[emb]:[])):[]; let added=false;
      for(const e of embs){ if(!list.some(x=>x.id===e.id)){ e.dirty=false; await api('PUT','proyectos/'+encodeURIComponent(e.id),{data:e,base:0}); added=true; } }
      if(added) list=await api('GET','proyectos'); }catch(e){}
    sset(IDX,list);
    ui.view='home'; render(); return;
  }
  await migrateLocal(); try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{
    const emb=JSON.parse(document.getElementById('proyecto-data').textContent||'null');
    const embs=emb?(emb.multi?emb.projects:(emb.id?[emb]:[])):[];
    for(const e of embs){ // el archivo trae los proyectos; si este navegador tiene una versión más nueva, se respeta
      const local=await dread(PK(e.id));
      if(!local||!local.updated||(e.updated||'')>local.updated){ e.dirty=false; dput(PK(e.id),e); const l=listProjects().filter(x=>x.id!==e.id); l.push({id:e.id,name:e.name,updated:e.updated,n:e.rows.length,archived:!!e.archived}); l.sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')); sset(IDX,l); }
    }
    if(embs.length){ const act=listProjects().filter(x=>!x.archived); const cur=emb.current&&act.find(x=>x.id===emb.current);
      ui.view='home'; render(); linkFile(); return; }
  }catch(e){}
  ui.view='home'; render();
})();
window.addEventListener('resize',()=>{ if(ui.view==='board'&&P) drawChart(); });
